<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Semestre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: cabeçalho fixo com abas, conteúdo em uma coluna larga; texto em azul-marinho, destaques em bordô */
:root{
  --bg:#f6f5f4; --surface:#ffffff; --surface-2:#ebe9e8; --line:#d9d6d4;
  --fg:#14213d; --muted:#565f73; --ink:#14284f;
  --accent:#7a1f35; --accent-ink:#ffffff;
  --ok:#17703d; --warn:#8a5a0f; --bad:#b3302a;
  --ok-bg:#dff3e7; --warn-bg:#fbefd6; --bad-bg:#fbe1df;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d111a; --surface:#141a27; --surface-2:#1d2535; --line:#2d374b;
  --fg:#e8ebf3; --muted:#9da6ba; --ink:#9db8f0;
  --accent:#b83a56; --accent-ink:#ffffff;
  --ok:#4cc583; --warn:#e5a84a; --bad:#f07068;
  --ok-bg:#16301f; --warn-bg:#33270f; --bad-bg:#3a1a19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d111a; --surface:#141a27; --surface-2:#1d2535; --line:#2d374b;
  --fg:#e8ebf3; --muted:#9da6ba; --ink:#9db8f0;
  --accent:#b83a56; --accent-ink:#ffffff;
  --ok:#4cc583; --warn:#e5a84a; --bad:#f07068;
  --ok-bg:#16301f; --warn-bg:#33270f; --bad-bg:#3a1a19; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;scrollbar-color:var(--line) transparent}
::selection{background:var(--accent);color:var(--accent-ink)}
input,textarea{caret-color:var(--ink)}
input[type=checkbox]{accent-color:var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 6px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0;letter-spacing:-.01em}
h1 mark{background:var(--accent);color:var(--accent-ink);padding:0 .15em;border-radius:4px}
.sub{color:var(--muted);font-size:.85rem}
nav{display:flex;gap:4px;overflow-x:auto;padding-block:4px 0;scrollbar-width:none}
nav a{padding:10px 12px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent}
nav.mais{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent)}
@media (max-width:480px){nav{gap:0}nav a{flex:1 0 auto;text-align:center;padding:13px 4px;font-size:.9rem}nav a[aria-current="page"]{font-weight:600}nav .lg{display:none}}
.erro{color:var(--bad);font-size:.9rem;font-weight:500;margin:0}
nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main{padding-block:22px 60px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:500;font-size:1rem;margin:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:18px}
.grid2>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{margin-bottom:10px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px}
button:hover{background:var(--surface-2)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:default;transform:none}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{filter:brightness(.95)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px;font-size:.85rem}
button.ghost:hover{color:var(--fg);background:var(--surface-2)}
button.danger{color:var(--bad)}
.notice{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;color:var(--muted);font-size:.9rem;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{color:var(--muted);font-size:.92rem;padding:8px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.hl{background:var(--accent);color:var(--accent-ink)}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:3px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--accent);outline:1px solid var(--accent)}
.day h3{font-size:.95rem;display:flex;justify-content:space-between}
.blk{background:color-mix(in srgb,var(--c,var(--ink)) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c,var(--ink)) 30%,transparent);border-radius:8px;padding:7px 9px;font-size:.84rem;cursor:pointer;text-align:left;width:100%}
.blk:hover{background:color-mix(in srgb,var(--c,var(--ink)) 20%,var(--surface))}
.blk .n::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.blk .h{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.blk .n{font-weight:600;overflow-wrap:anywhere}
.blk .p{color:var(--muted);overflow-wrap:anywhere}
@media (max-width:760px){.week{grid-template-columns:1fr;overflow-x:visible}.day{min-height:0}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card>.t::before,.card .bar .t::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat .v{font-family:var(--f-mono);font-size:1.3rem;font-weight:600}
.big{font-family:var(--f-mono);font-weight:600;font-size:1.05rem}
.count{font-family:var(--f-mono);font-size:.78rem;min-width:62px;text-align:right;color:var(--muted)}
.count b{display:block;font-size:1.1rem;color:var(--fg)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(10,14,22,.5)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field.check{flex-direction:row;align-items:center;gap:8px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.field.check input{width:auto}
textarea{min-height:70px;resize:vertical}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:block}
.swatches input{position:absolute;opacity:0;width:1px;height:1px}
.swatches input:checked+label{border-color:var(--fg);box-shadow:inset 0 0 0 3px var(--surface)}
.swatches input:focus-visible+label{outline:2px solid var(--ink);outline-offset:2px}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.actions .r{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.9rem;z-index:20}
.filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter select{width:auto}
.need{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.day,.panel,.card{transition:border-color .15s}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Meu <mark>Semestre</mark></h1>
        <div class="sub" id="hoje"></div>
      </div>
      <div class="filter"><span class="sub" id="status">Carregando…</span><button class="ghost" id="bkp">Backup</button></div>
    </div>
    <nav id="tabs" aria-label="Seções">
      <a href="#painel">Painel</a>
      <a href="#cronograma">Cronograma</a>
      <a href="#provas">Provas<span class="lg"> e notas</span></a>
      <a href="#faltas">Faltas</a>
      <a href="#materias">Matérias</a>
    </nav>
  </div>
</header>

<main class="wrap" id="view"></main>

<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const DIAS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const DIAS_CURTO = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const CORES = ["#3b6fd8","#d9534f","#2e9e6a","#c58a12","#8a55c9","#d0679d","#1f9bb0","#6b7a8f"];
const COLS = ["materias","cronograma","faltas","provas"];
const LS_KEY = "meu-semestre-v1";

const S = { materias:[], cronograma:[], faltas:[], provas:[], config:{ mediaMin:6, freqMin:75 } };
let db = null, mode = "carregando";

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { if (v === "" || v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
const fmt = (n, d=1) => n == null ? "—" : n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const hojeISO = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtData = s => s ? parseD(s).toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"}) : "sem data";
const diasAte = s => Math.round((parseD(s) - parseD(hojeISO())) / 86400000);
const mat = id => S.materias.find(m => m.id === id);
const corDe = id => mat(id)?.cor || "#6b7a8f";
const nomeDe = id => mat(id)?.nome || "Sem matéria";
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2200); }

/* ---------- armazenamento ---------- */
function loadLocal(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw) Object.assign(S, JSON.parse(raw)); } catch(e){}
}
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }

async function salvar(col, id, data){
  if (db) {
    try { id ? await db.collection(col).doc(id).set(data) : await db.collection(col).add(data); }
    catch(e){ toast(e.code === "quota_exceeded" ? "Limite de registros atingido. Apague itens antigos." : "Não foi possível salvar. Tente de novo."); return false; }
  } else {
    const arr = S[col]; const i = id ? arr.findIndex(x => x.id === id) : -1;
    if (i >= 0) arr[i] = { id, ...data }; else arr.push({ id: id || uid(), ...data });
    saveLocal(); render();
  }
  return true;
}
async function apagar(col, id){
  if (db) { try { await db.collection(col).doc(id).delete(); } catch(e){ toast("Não foi possível apagar."); return; } }
  else { S[col] = S[col].filter(x => x.id !== id); saveLocal(); render(); }
}
async function salvarConfig(c){
  S.config = c;
  if (db) { try { await db.doc("config/geral").set(c); } catch(e){ toast("Não foi possível salvar."); } }
  else { saveLocal(); render(); }
}

async function iniciar(){
  let cdb = null;
  try { cdb = await window.claude?.use?.("db"); } catch(e){}
  if (!cdb) {
    mode = "local"; loadLocal();
    $("#status").textContent = "Salvo neste navegador";
    render(); return;
  }
  db = cdb;
  const timer = setTimeout(() => { $("#status").textContent = "Sem conexão com seus dados ainda…"; }, 10000);
  let pend = new Set([...COLS, "config"]);
  const pronto = (k, snap) => { if (!snap.metadata.fromCache) { pend.delete(k); if (!pend.size){ clearTimeout(timer); $("#status").textContent = "Salvo na sua conta"; } } };
  COLS.forEach(c => db.collection(c).onSnapshot(snap => {
    S[c] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    mode = "nuvem"; pronto(c, snap); render();
  }, () => { clearTimeout(timer); $("#status").textContent = "Erro ao carregar dados"; }));
  db.doc("config/geral").onSnapshot(snap => {
    if (snap.exists) S.config = { mediaMin:6, freqMin:75, ...snap.data() };
    pronto("config", snap); render();
  }, () => {});
}

/* ---------- cálculos ---------- */
function resumoNotas(materiaId){
  const its = S.provas.filter(p => p.materiaId === materiaId);
  let soma = 0, pesoFeito = 0, pesoTotal = 0;
  its.forEach(p => {
    const peso = num(p.peso) ?? 1; pesoTotal += peso;
    const n = num(p.nota), mx = num(p.notaMax) || 10;
    if (n != null) { soma += (n / mx) * 10 * peso; pesoFeito += peso; }
  });
  const media = pesoFeito ? soma / pesoFeito : null;
  const resta = pesoTotal - pesoFeito;
  let precisa = null;
  if (resta > 0) precisa = (S.config.mediaMin * pesoTotal - soma) / resta;
  return { media, precisa, resta, n: its.length };
}
function resumoFaltas(materiaId){
  const m = mat(materiaId);
  const fs = S.faltas.filter(f => f.materiaId === materiaId);
  const soma = l => l.reduce((a,f) => a + (num(f.aulas) ?? 1), 0);
  // falta justificada não conta no limite
  const total = soma(fs.filter(f => !f.justificada)), just = soma(fs.filter(f => f.justificada));
  const ch = num(m?.cargaHoraria);
  const limite = ch ? Math.floor(ch * (1 - S.config.freqMin/100)) : null;
  return { total, just, limite, restam: limite != null ? limite - total : null };
}
function chipMedia(media){
  if (media == null) return '<span class="chip">sem notas</span>';
  const min = S.config.mediaMin;
  const cls = media >= min ? "ok" : media >= min - 1 ? "warn" : "bad";
  return `<span class="chip ${cls} num">${fmt(media)}</span>`;
}
// domingo da semana da data, para comparar semanas do calendário
const semanaDe = s => { const d = parseD(s); d.setDate(d.getDate() - d.getDay()); return d; };
function chipPrazo(data){
  const d = diasAte(data);
  if (d <= 3) return '<span class="chip bad">perto</span>';
  const sem = Math.round((semanaDe(data) - semanaDe(hojeISO())) / 604800000);
  return sem === 0 ? '<span class="chip warn">esta semana</span>' : sem === 1 ? '<span class="chip">semana que vem</span>' : "";
}
function corFaltas(r){
  if (r.limite == null) return "var(--ink)";
  const p = r.total / Math.max(r.limite,1);
  return p >= 1 ? "var(--bad)" : p >= .7 ? "var(--warn)" : "var(--ok)";
}

/* ---------- views ---------- */
const temExemplos = () => COLS.some(c => S[c].some(x => x.exemplo));
function avisoExemplo(){
  if (!temExemplos()) return "";
  return `<div class="notice"><span>Os itens marcados como <span class="chip hl">exemplo</span> estão aqui só para mostrar como funciona.</span><button id="limparEx">Apagar exemplos</button></div>`;
}
const exTag = x => x.exemplo ? ' <span class="chip hl">exemplo</span>' : "";

function vCarregando(){ return '<p class="empty">Carregando seus dados…</p>'; }
function vPainel(){
  const hoje = new Date().getDay();
  const blocos = S.cronograma.filter(b => +b.dia === hoje).sort((a,b) => (a.inicio||"").localeCompare(b.inicio||""));
  const proximas = S.provas.filter(p => p.data && diasAte(p.data) >= 0 && num(p.nota) == null)
    .sort((a,b) => a.data.localeCompare(b.data)).slice(0,6);
  const linhasMat = S.materias.map(m => {
    const n = resumoNotas(m.id), f = resumoFaltas(m.id);
    const pct = f.limite ? Math.min(100, f.total / f.limite * 100) : 0;
    let need = "";
    if (n.precisa != null && n.n) need = n.precisa > 10 ? `<span class="chip bad">média fora de alcance</span>` : n.precisa <= 0 ? `<span class="chip ok">já garantida</span>` : `precisa de <b class="num">${fmt(n.precisa)}</b> no restante`;
    return `<tr>
      <td><span class="dot" style="background:${esc(m.cor)}"></span> ${esc(m.nome)}${exTag(m)}</td>
      <td>${chipMedia(n.media)}<div class="need">${need}</div></td>
      <td style="min-width:140px"><span class="num">${f.total}${f.limite!=null?" / "+f.limite:""}</span> <span class="need">aulas</span>
        ${f.limite!=null?`<div class="meter"><i style="width:${pct}%;background:${corFaltas(f)}"></i></div>`:""}</td>
    </tr>`;
  }).join("");

  return `${avisoExemplo()}
  <div class="grid2">
    <section class="panel">
      <div class="bar" style="margin-bottom:8px"><h3>Hoje · ${DIAS[hoje]}</h3><button class="ghost" data-novo="cronograma" data-dia="${hoje}">+ Bloco</button></div>
      ${blocos.length ? `<div class="list">${blocos.map(b => `
        <div class="row"><span class="dot" style="background:${esc(corDe(b.materiaId))}"></span>
          <div class="grow"><div class="t">${esc(nomeDe(b.materiaId))}${exTag(b)}</div><div class="m">${esc(b.topico||rotTipo(b.tipo))}</div></div>
          <span class="num m">${esc(b.inicio||"")}–${esc(b.fim||"")}</span></div>`).join("")}</div>`
        : `<p class="empty">Nada marcado para hoje. Use o Cronograma para montar sua semana.</p>`}
    </section>
    <section class="panel">
      <div class="bar" style="margin-bottom:8px"><h3>Próximas provas e entregas</h3><button class="ghost" data-novo="provas">+ Prova</button></div>
      ${proximas.length ? `<div class="list">${proximas.map(p => { const d = diasAte(p.data); return `
        <div class="row"><div class="count"><b>${d===0?"hoje":d}</b>${d===0?"":d===1?"dia":"dias"}</div>

const optMaterias = () => S.materias.map(m => [m.id, m.nome]);
const FORMS = {
  materias: { titulo:"Matéria", campos:[
    {k:"nome",l:"Nome",t:"text",req:1},
    {k:"professor",l:"Professor(a)",t:"text"},

    {k:"dia",l:"Dia",t:"select",opts:[1,2,3,4,5,6,0].map(d=>[String(d),DIAS[d]])},
    {k:"tipo",l:"Tipo",t:"select",opts:[["estudo","Estudo"],["revisao","Revisão"],["lista","Lista de exercícios"],["aula","Aula"]]},
    {duo:[{k:"inicio",l:"Início",t:"time",def:"19:00"},{k:"fim",l:"Fim",t:"time",def:"20:30"}]},
    {k:"materiaId",l:"Matéria",t:"select",opts:optMaterias},
    {k:"topico",l:"O que estudar",t:"text"} ]},
  faltas: { titulo:"Falta", campos:[

    {k:"obs",l:"Observação",t:"text"} ]},
  provas: { titulo:"Prova ou trabalho", campos:[
    {k:"materiaId",l:"Matéria",t:"select",opts:optMaterias},
    {k:"titulo",l:"Título",t:"text",req:1,ph:"Ex.: P1, Trabalho final"},
    {duo:[{k:"tipo",l:"Tipo",t:"select",opts:[["prova","Prova"],["trabalho","Trabalho"],["lista","Lista"],["seminario","Seminário"]]},{k:"data",l:"Data",t:"date"}]},
    {duo:[{k:"nota",l:"Nota (vazio se ainda não saiu)",t:"num"},{k:"notaMax",l:"Vale",t:"num",def:"10"}]},
    {k:"peso",l:"Peso na média",t:"num",def:"1"},
    {k:"conteudo",l:"Conteúdo",t:"area"} ]},
};

function campoHTML(c, v){
  const id = "f_"+c.k, val = v ?? (typeof c.def==="function"?c.def():c.def) ?? "";
  if (c.t==="select"){ const o = typeof c.opts==="function"?c.opts():c.opts;
    return `<div class="field"><label for="${id}">${c.l}</label><select id="${id}" name="${c.k}">${o.map(([a,b])=>`<option value="${esc(a)}" ${String(val)===String(a)?"selected":""}>${esc(b)}</option>`).join("")}</select></div>`; }
  if (c.t==="check") return `<div class="field check"><input type="checkbox" id="${id}" name="${c.k}" ${val?"checked":""}><label for="${id}">${c.l}</label></div>`;
  if (c.t==="area") return `<div class="field"><label for="${id}">${c.l}</label><textarea id="${id}" name="${c.k}">${esc(val)}</textarea></div>`;
  if (c.t==="cor"){ const cur = val || CORES[S.materias.length % CORES.length];
    return `<div class="field"><span class="label" style="text-transform:none;letter-spacing:0;font-size:.82rem">${c.l}</span><div class="swatches">${CORES.map((h,i)=>`<input type="radio" name="cor" id="cor${i}" value="${h}" ${h===cur?"checked":""}><label for="cor${i}" style="background:${h}" title="${h}"></label>`).join("")}</div></div>`; }
  const type = c.t==="num"?"text":c.t;
  return `<div class="field"><label for="${id}">${c.l}</label><input id="${id}" name="${c.k}" type="${type}" ${c.t==="num"?'inputmode="decimal"':""} value="${esc(val)}" ${c.req?"required":""} placeholder="${esc(c.ph||"")}">${c.hint?`<span class="need">${c.hint}</span>`:""}</div>`;
}

// devolve [campo, mensagem] no primeiro problema, ou null se está tudo certo
function validar(col, out, raw){
  for (const c of FORMS[col].campos.flatMap(c => c.duo || [c]))
    if (c.t==="num" && String(raw[c.k] ?? "").trim() !== "" && out[c.k] == null) return [c.k, `${c.l.split(" (")[0]}: use só números.`];
  if (col==="materias" && out.cargaHoraria != null && out.cargaHoraria <= 0) return ["cargaHoraria", "O total de aulas precisa ser maior que zero."];
  if (col==="cronograma"){
    if (!out.inicio || !out.fim) return [out.inicio ? "fim" : "inicio", "Informe o horário de início e de fim."];
    if (out.fim <= out.inicio) return ["fim", "O fim precisa ser depois do início."];
  }
  if (col==="faltas"){
    if (!out.data) return ["data", "Informe a data da falta."];
    if (out.aulas == null || out.aulas < 1) return ["aulas", "Informe quantas aulas você perdeu (1 ou mais)."];
  }
  if (col==="provas"){
    if (out.notaMax == null || out.notaMax <= 0) return ["notaMax", "Informe quanto a avaliação vale (maior que zero)."];
    if (out.peso == null || out.peso <= 0) return ["peso", "O peso precisa ser maior que zero."];
    if (out.nota != null && (out.nota < 0 || out.nota > out.notaMax)) return ["nota", `A nota precisa ficar entre 0 e ${fmt(out.notaMax)}.`];
  }
  return null;
}
function mostrarErro(campoId, msg){
  const e = $("#erro"); e.textContent = msg; e.hidden = false;
  document.getElementById(campoId)?.focus();
}

function abrirForm(col, id, preset={}){
  const F = FORMS[col], item = id ? S[col].find(x=>x.id===id) : null;
  if (col!=="materias" && !S.materias.length){ toast("Cadastre uma matéria primeiro."); location.hash="#materias"; return; }
  const dados = { ...preset, ...(item||{}) };
  const campos = F.campos.map(c => c.duo ? `<div class="duo">${c.duo.map(d=>campoHTML(d,dados[d.k])).join("")}</div>` : campoHTML(c, dados[c.k])).join("");
  const frm = $("#frm");
  frm.innerHTML = `<h2>${id?"Editar":"Nova"} ${F.titulo.toLowerCase()}</h2>${campos}
    <p class="erro" id="erro" role="alert" hidden></p>
    <div class="actions">${id?`<button type="button" class="danger" id="del">Excluir</button>`:"<span></span>"}
      <div class="r"><button type="button" id="cancel">Cancelar</button><button type="submit" class="primary">Salvar</button></div></div>`;
  frm.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(frm), out = {}, raw = {};
    const todos = F.campos.flatMap(c => c.duo || [c]);
    todos.forEach(c => { if (c.t==="check") out[c.k] = fd.has(c.k); else { let v = fd.get(c.k) ?? ""; raw[c.k] = v; if (c.t==="num") v = num(v); out[c.k] = v; } });
    const erro = validar(col, out, raw);
    if (erro){ mostrarErro("f_"+erro[0], erro[1]); return; }
    if (col==="cronograma") out.dia = +out.dia;
    if (item?.exemplo) out.exemplo = true;
    const ok = await salvar(col, id, out);
    if (ok){ $("#dlg").close(); toast("Salvo"); }
  };
  $("#cancel").onclick = () => $("#dlg").close();
  const del = $("#del");
  // apagar uma matéria leva junto os blocos, faltas e provas dela
  const deps = col==="materias" ? ["cronograma","faltas","provas"].flatMap(c => S[c].filter(x => x.materiaId === id).map(x => [c, x.id])) : [];
  if (del) del.onclick = async () => {
    if (del.dataset.arm){
      del.disabled = true;
      for (const [c, i] of deps) await apagar(c, i);
      await apagar(col, id); $("#dlg").close(); toast("Excluído"); return;
    }
    del.dataset.arm = 1;
    del.textContent = deps.length ? `Confirmar: apaga também ${deps.length} ${deps.length>1?"itens":"item"} dela` : "Confirmar exclusão";
    setTimeout(() => { if (del.isConnected){ delete del.dataset.arm; del.textContent = "Excluir"; } }, 3500);
  };
  $("#dlg").showModal();
}

function abrirConfig(){
  const frm = $("#frm");
  frm.innerHTML = `<h2>Critérios de aprovação</h2>
    <div class="field"><label for="c_media">Média mínima para aprovação (0 a 10)</label><input id="c_media" inputmode="decimal" value="${esc(fmt(S.config.mediaMin))}"></div>
    <div class="field"><label for="c_freq">Frequência mínima (%)</label><input id="c_freq" inputmode="numeric" value="${esc(S.config.freqMin)}"><span class="need">Com 75%, pode faltar até 25% das aulas.</span></div>
    <p class="erro" id="erro" role="alert" hidden></p>
    <div class="actions"><span></span><div class="r"><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Salvar</button></div></div>`;
  frm.onsubmit = async e => { e.preventDefault();
    const mediaMin = num($("#c_media").value), freqMin = num($("#c_freq").value);
    if (mediaMin == null || mediaMin < 0 || mediaMin > 10){ mostrarErro("c_media", "A média mínima precisa ficar entre 0 e 10."); return; }
    if (freqMin == null || freqMin < 1 || freqMin > 100){ mostrarErro("c_freq", "A frequência mínima precisa ficar entre 1 e 100."); return; }
    await salvarConfig({ mediaMin, freqMin });
    $("#dlg").close(); toast("Salvo"); };
  $("#cancel").onclick = () => $("#dlg").close();
  $("#dlg").showModal();
}

function abrirBackup(){
  const frm = $("#frm");
  frm.innerHTML = `<h2>Backup dos seus dados</h2>
    <p class="need">Baixe um arquivo com matérias, cronograma, faltas e notas. Guarde no seu computador ou Drive. Para restaurar, importe o arquivo aqui.</p>
    <button type="button" class="primary" id="bkDown">Baixar backup (.json)</button>
    <div class="field"><label for="bkFile">Importar backup</label><input type="file" id="bkFile" accept=".json,application/json"><span class="need">Junta com o que já existe; itens com o mesmo código são substituídos.</span></div>
    <div class="actions"><span></span><div class="r"><button type="button" id="cancel">Fechar</button></div></div>`;
  frm.onsubmit = e => e.preventDefault();
  $("#cancel").onclick = () => $("#dlg").close();
  $("#bkDown").onclick = async () => {
    const data = JSON.stringify({ app:"meu-semestre", versao:1, ...Object.fromEntries(COLS.map(c=>[c,S[c]])), config:S.config }, null, 2);
    const nome = "meu-semestre-"+hojeISO()+".json";
    if (!window.claude){
      // fora do Claude (site próprio ou arquivo aberto no navegador): download direto
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], { type:"application/json" }));
      a.download = nome; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast("Backup baixado"); return;
    }
    const dl = await window.claude?.use?.("downloads").catch(()=>null);
    if (!dl){ try { await navigator.clipboard.writeText(data); toast("Backup copiado. Cole num arquivo .json"); } catch(e){ toast("Não foi possível baixar aqui."); } return; }
    try { await dl.save({ filename:nome, data }); toast("Backup salvo"); }
    catch(e){ if (e.code!=="declined") toast("Não foi possível salvar o arquivo."); }
  };
  $("#bkFile").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = async () => {
      let d; try { d = JSON.parse(rd.result); } catch(_){ toast("Arquivo inválido: não é um backup do Meu Semestre."); return; }
      if (d.app!=="meu-semestre"){ toast("Arquivo inválido: não é um backup do Meu Semestre."); return; }
      let n = 0;
      for (const c of COLS) for (const {id, ...x} of (d[c]||[])) { if (await salvar(c, id, x)) n++; }
      if (d.config) await salvarConfig(d.config);
      $("#dlg").close(); toast(n+" itens importados");
    };
    rd.readAsText(f);
  };
  $("#dlg").showModal();
}

/* ---------- render e rotas ---------- */
const VIEWS = { painel:vPainel, cronograma:vCronograma, provas:vProvas, faltas:vFaltas, materias:vMaterias };
function rota(){ const h = location.hash.slice(1); return VIEWS[h] ? h : "painel"; }
let renderPend = false;
function render(){
  if (renderPend) return; renderPend = true;
  requestAnimationFrame(() => {
    renderPend = false;
    const r = rota();
    document.querySelectorAll("#tabs a").forEach(a => { if (a.getAttribute("href")==="#"+r) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
    $("#view").innerHTML = mode==="carregando" ? vCarregando() : VIEWS[r]();
    $("#tabs a[aria-current]")?.scrollIntoView({ inline:"nearest", block:"nearest" });
    navFade();
  });
}
// mostra um esmaecido na direita quando ainda há abas escondidas
function navFade(){ const n = $("#tabs"); n.classList.toggle("mais", n.scrollWidth - n.clientWidth - n.scrollLeft > 4); }
$("#tabs").addEventListener("scroll", navFade, { passive:true });
window.addEventListener("resize", navFade);

$("#view").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.novo) abrirForm(b.dataset.novo, null, b.dataset.dia!=null ? {dia:b.dataset.dia} : {});
  else if (b.dataset.edit) abrirForm(b.dataset.edit, b.dataset.id);
  else if (b.id==="cfg") abrirConfig();
  else if (b.id==="limparEx"){
    if (!b.dataset.arm){ b.dataset.arm=1; b.textContent="Confirmar: apagar exemplos"; return; }
    b.disabled = true;
    for (const c of COLS) for (const x of S[c].filter(x=>x.exemplo)) await apagar(c, x.id);
    toast("Exemplos apagados");
  }
});
$("#view").addEventListener("change", e => { if (e.target.id==="fProva"){ filtroProvas = e.target.value; render(); } });
window.addEventListener("hashchange", render);
$("#bkp").onclick = abrirBackup;

$("#hoje").textContent = new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
render();
iniciar();
})();
</script>
</body>
