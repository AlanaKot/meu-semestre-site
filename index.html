<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Semestre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a27" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Semestre">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: cabeçalho fixo com abas, conteúdo em uma coluna larga; texto em azul-marinho, destaques em bordô */
:root{
  --bg:#f6f5f4; --surface:#ffffff; --surface-2:#ebe9e8; --line:#d9d6d4;
  --fg:#14213d; --muted:#565f73; --ink:#14284f;
  --accent:#7a1f35; --accent-ink:#ffffff;
  --ok:#17703d; --warn:#8a5a0f; --bad:#b3302a;
  --ok-bg:#dff3e7; --warn-bg:#fbefd6; --bad-bg:#fbe1df;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d111a; --surface:#141a27; --surface-2:#1d2535; --line:#2d374b;
  --fg:#e8ebf3; --muted:#9da6ba; --ink:#9db8f0;
  --accent:#b83a56; --accent-ink:#ffffff;
  --ok:#4cc583; --warn:#e5a84a; --bad:#f07068;
  --ok-bg:#16301f; --warn-bg:#33270f; --bad-bg:#3a1a19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d111a; --surface:#141a27; --surface-2:#1d2535; --line:#2d374b;
  --fg:#e8ebf3; --muted:#9da6ba; --ink:#9db8f0;
  --accent:#b83a56; --accent-ink:#ffffff;
  --ok:#4cc583; --warn:#e5a84a; --bad:#f07068;
  --ok-bg:#16301f; --warn-bg:#33270f; --bad-bg:#3a1a19; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;scrollbar-color:var(--line) transparent}
::selection{background:var(--accent);color:var(--accent-ink)}
input,textarea{caret-color:var(--ink)}
input[type=checkbox]{accent-color:var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 6px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0;letter-spacing:-.01em}
h1 mark{background:var(--accent);color:var(--accent-ink);padding:0 .15em;border-radius:4px}
.sub{color:var(--muted);font-size:.85rem}
nav{display:flex;gap:4px;overflow-x:auto;padding-block:4px 0;scrollbar-width:none}
nav a{padding:10px 12px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent}
nav.mais{-webkit-mask-image:linear-gradient(to right,#000 82%,transparent);mask-image:linear-gradient(to right,#000 82%,transparent)}
@media (max-width:480px){nav{gap:0}nav a{flex:1 0 auto;text-align:center;padding:13px 4px;font-size:.9rem}nav a[aria-current="page"]{font-weight:600}nav .lg{display:none}}
.erro{color:var(--bad);font-size:.9rem;font-weight:500;margin:0}
nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main{padding-block:22px 60px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:500;font-size:1rem;margin:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:18px}
.grid2>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h3{margin-bottom:10px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px}
button:hover{background:var(--surface-2)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:default;transform:none}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{filter:brightness(.95)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px;font-size:.85rem}
button.ghost:hover{color:var(--fg);background:var(--surface-2)}
button.danger{color:var(--bad)}
.notice{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;color:var(--muted);font-size:.9rem;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{color:var(--muted);font-size:.92rem;padding:8px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.hl{background:var(--accent);color:var(--accent-ink)}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:3px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--accent);outline:1px solid var(--accent)}
.day h3{font-size:.95rem;display:flex;justify-content:space-between}
.blk{background:color-mix(in srgb,var(--c,var(--ink)) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c,var(--ink)) 30%,transparent);border-radius:8px;padding:7px 9px;font-size:.84rem;cursor:pointer;text-align:left;width:100%}
.blk:hover{background:color-mix(in srgb,var(--c,var(--ink)) 20%,var(--surface))}
.blk .n::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.blk .h{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.blk .n{font-weight:600;overflow-wrap:anywhere}
.blk .p{color:var(--muted);overflow-wrap:anywhere}
@media (max-width:760px){.week{grid-template-columns:1fr;overflow-x:visible}.day{min-height:0}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--surface);color:var(--muted)}
.seg button[aria-pressed="true"],.seg button[aria-pressed="true"]:hover{background:var(--accent);color:var(--accent-ink);font-weight:600}
.mesnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mesnav h2{min-width:9.5em}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.mh{background:var(--surface-2);padding:6px 8px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.mc{background:var(--surface);min-height:98px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mc.fora{background:var(--bg)}
.mc.fora .mn{color:var(--muted)}
.mn{border:0;background:transparent;padding:0;width:28px;height:28px;border-radius:50%;font-family:var(--f-mono);font-size:.82rem;align-self:flex-start}
.mc.hoje .mn,.mc.hoje .mn:hover{background:var(--accent);color:var(--accent-ink);font-weight:600}
.mi{border:1px solid transparent;border-radius:4px;padding:2px 6px;font-size:.72rem;text-align:left;line-height:1.3;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:none}
button.mi-prova,button.mi-prova:hover{background:var(--accent);color:var(--accent-ink)}
button.mi-entrega,button.mi-entrega:hover{border-color:var(--accent);background:var(--surface)}
button.mi-evento,button.mi-evento:hover{background:var(--surface-2)}
.mi:hover{filter:brightness(.94)}
.leg{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:18px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:14px;height:10px;border-radius:3px;border:1px solid transparent}
@media (max-width:760px){.mc{min-height:60px;padding:4px;gap:3px}.mh{padding:6px 2px;text-align:center}.mi{height:7px;padding:0}.mi .mt{display:none}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card>.t::before,.card .bar .t::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat .v{font-family:var(--f-mono);font-size:1.3rem;font-weight:600}
.big{font-family:var(--f-mono);font-weight:600;font-size:1.05rem}
.count{font-family:var(--f-mono);font-size:.78rem;min-width:62px;text-align:right;color:var(--muted)}
.count b{display:block;font-size:1.1rem;color:var(--fg)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:0;width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(10,14,22,.5)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field.check{flex-direction:row;align-items:center;gap:8px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.field.check input{width:auto}
textarea{min-height:70px;resize:vertical}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:block}
.swatches input{position:absolute;opacity:0;width:1px;height:1px}
.swatches input:checked+label{border-color:var(--fg);box-shadow:inset 0 0 0 3px var(--surface)}
.swatches input:focus-visible+label{outline:2px solid var(--ink);outline-offset:2px}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.actions .r{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.9rem;z-index:20}
.filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter select{width:auto}
.need{font-size:.85rem;color:var(--muted)}
.est{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
.est input{width:18px;height:18px;margin-top:2px;flex:none}
.est input:checked+span{color:var(--muted);text-decoration:line-through}
.est.manter input:checked+span{color:inherit;text-decoration:none;font-weight:600}
.dias{display:flex;gap:6px 14px;flex-wrap:wrap}
.dias label{display:inline-flex;align-items:center;gap:6px;font-weight:400;color:var(--fg);font-size:.92rem}
.dias input{width:auto}
.faltei{display:flex;flex-direction:column}
.faltei .row{padding:8px 0}
.faltei .est{flex:1;min-width:0;padding:0;align-items:center}
.faltei .est input{margin-top:0}
.faltei input.qtd{width:64px;text-align:center;flex:none}
.notas{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
.notas>button{align-self:flex-start;margin-left:-8px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{color:var(--accent);font-weight:500;font-size:.88rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links a:hover{border-color:var(--accent)}
.links a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.nota-txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.link-ed{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin-bottom:6px;align-items:center}
@media (max-width:480px){.link-ed{grid-template-columns:1fr auto}.link-ed input[name=lu]{grid-column:1;grid-row:2}.link-ed button{grid-row:1/3;grid-column:2}}
/* telas de toque (celular e tablet): alvos maiores para o dedo e texto de 16px nos campos (evita o zoom automático do iPhone) */
@media (pointer:coarse),(max-width:760px){
  button:not(.mi){min-height:44px;padding:10px 14px}
  button.ghost{padding:10px 12px;font-size:.92rem}
  .mn{min-height:0;width:36px;height:36px}
  .blk{min-height:44px}
  input,select,textarea{font-size:16px;padding:11px 12px}
  .est{padding:8px 0}
  .est input,.field.check input,.dias input{width:22px;height:22px}
  .swatches label{width:40px;height:40px}
  .links a{padding:9px 14px}
  .dias{gap:10px 18px}
}
@media (prefers-reduced-motion:no-preference){.day,.panel,.card{transition:border-color .15s}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Meu <mark>Semestre</mark></h1>
        <div class="sub" id="hoje"></div>
      </div>
      <div class="filter"><span class="sub" id="status">Carregando…</span><button class="ghost" id="instalar" hidden>Instalar</button><button class="ghost" id="bkp">Backup</button></div>
    </div>
    <nav id="tabs" aria-label="Seções">
      <a href="#painel">Painel</a>
      <a href="#cronograma">Cronograma</a>
      <a href="#provas">Provas<span class="lg"> e notas</span></a>
      <a href="#faltas">Faltas</a>
      <a href="#materias">Matérias</a>
    </nav>
  </div>
</header>

<main class="wrap" id="view"></main>

<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const DIAS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const DIAS_CURTO = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const CORES = ["#3b6fd8","#d9534f","#2e9e6a","#c58a12","#8a55c9","#d0679d","#1f9bb0","#6b7a8f"];
const COLS = ["materias","cronograma","faltas","provas","eventos"];
const LS_KEY = "meu-semestre-v1";
const LS_BACKUP = "meu-semestre-backup-em";
const FORA_DO_CLAUDE = !window.claude; // site próprio ou arquivo aberto no navegador

const S = { materias:[], cronograma:[], faltas:[], provas:[], eventos:[], config:{ mediaMin:6, freqMin:75 } };
let db = null, mode = "carregando";

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { if (v === "" || v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
const fmt = (n, d=1) => n == null ? "—" : n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const hojeISO = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtData = s => s ? parseD(s).toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"}) : "sem data";
const fmtCurta = s => parseD(s).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
const isoDe = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const periodo = e => e.dataFim && e.dataFim !== e.data ? `${fmtCurta(e.data)} a ${fmtCurta(e.dataFim)}` : fmtData(e.data);
const diasAte = s => Math.round((parseD(s) - parseD(hojeISO())) / 86400000);
const mat = id => S.materias.find(m => m.id === id);
const corDe = id => mat(id)?.cor || "#6b7a8f";
const nomeDe = id => mat(id)?.nome || "Sem matéria";
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2200); }

/* ---------- armazenamento ---------- */
function loadLocal(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw) Object.assign(S, JSON.parse(raw)); } catch(e){}
}
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }

async function salvar(col, id, data){
  if (db) {
    try { id ? await db.collection(col).doc(id).set(data) : await db.collection(col).add(data); }
    catch(e){ toast(e.code === "quota_exceeded" ? "Limite de registros atingido. Apague itens antigos." : "Não foi possível salvar. Tente de novo."); return false; }
  } else {
    const arr = S[col]; const i = id ? arr.findIndex(x => x.id === id) : -1;
    if (i >= 0) arr[i] = { id, ...data }; else arr.push({ id: id || uid(), ...data });
    saveLocal(); render();
  }
  return true;
}
async function apagar(col, id){
  if (db) { try { await db.collection(col).doc(id).delete(); } catch(e){ toast("Não foi possível apagar."); return; } }
  else { S[col] = S[col].filter(x => x.id !== id); saveLocal(); render(); }
}
async function salvarConfig(c){
  S.config = c;
  if (db) { try { await db.doc("config/geral").set(c); } catch(e){ toast("Não foi possível salvar."); } }
  else { saveLocal(); render(); }
}

async function iniciar(){
  let cdb = null;
  try { cdb = await window.claude?.use?.("db"); } catch(e){}
  if (!cdb) {
    mode = "local"; loadLocal();
    $("#status").textContent = "Salvo neste navegador";
    render(); return;
  }
  db = cdb;
  const timer = setTimeout(() => { $("#status").textContent = "Sem conexão com seus dados ainda…"; }, 10000);
  let pend = new Set([...COLS, "config"]);
  const pronto = (k, snap) => { if (!snap.metadata.fromCache) { pend.delete(k); if (!pend.size){ clearTimeout(timer); $("#status").textContent = "Salvo na sua conta"; } } };
  COLS.forEach(c => db.collection(c).onSnapshot(snap => {
    S[c] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    mode = "nuvem"; pronto(c, snap); render();
  }, () => { clearTimeout(timer); $("#status").textContent = "Erro ao carregar dados"; }));
  db.doc("config/geral").onSnapshot(snap => {

/* ---------- cálculos ---------- */
function resumoNotas(materiaId){ return calcNotas(S.provas.filter(p => p.materiaId === materiaId)); }
// média ponderada das avaliações com nota e quanto falta tirar nas outras para chegar na média mínima
function calcNotas(its){
  let soma = 0, pesoFeito = 0, pesoTotal = 0;
  its.forEach(p => {
    const peso = num(p.peso) ?? 1; pesoTotal += peso;
    const n = num(p.nota), mx = num(p.notaMax) || 10;
    if (n != null) { soma += (n / mx) * 10 * peso; pesoFeito += peso; }
  });
  const media = pesoFeito ? soma / pesoFeito : null;
  const resta = pesoTotal - pesoFeito;
  let precisa = null;
  if (resta > 0) precisa = (S.config.mediaMin * pesoTotal - soma) / resta;
  return { media, precisa, resta, n: its.length };
}
function resumoFaltas(materiaId){
  const m = mat(materiaId);
  const fs = S.faltas.filter(f => f.materiaId === materiaId);
  const soma = l => l.reduce((a,f) => a + (num(f.aulas) ?? 1), 0);
  // falta justificada não conta no limite
  const total = soma(fs.filter(f => !f.justificada)), just = soma(fs.filter(f => f.justificada));
  const ch = num(m?.cargaHoraria);
  const limite = ch ? Math.floor(ch * (1 - S.config.freqMin/100)) : null;
  return { total, just, limite, restam: limite != null ? limite - total : null };
}
function chipMedia(media){
  if (media == null) return '<span class="chip">sem notas</span>';
  const min = S.config.mediaMin;
  const cls = media >= min ? "ok" : media >= min - 1 ? "warn" : "bad";
  return `<span class="chip ${cls} num">${fmt(media)}</span>`;
}
// domingo da semana da data, para comparar semanas do calendário
const semanaDe = s => { const d = parseD(s); d.setDate(d.getDate() - d.getDay()); return d; };
function chipPrazo(data){
  const d = diasAte(data);
  if (d <= 3) return '<span class="chip bad">perto</span>';
  const sem = Math.round((semanaDe(data) - semanaDe(hojeISO())) / 604800000);
  return sem === 0 ? '<span class="chip warn">esta semana</span>' : sem === 1 ? '<span class="chip">semana que vem</span>' : "";
}
function corFaltas(r){
  if (r.limite == null) return "var(--ink)";
  const p = r.total / Math.max(r.limite,1);
  return p >= 1 ? "var(--bad)" : p >= .7 ? "var(--warn)" : "var(--ok)";
}

/* ---------- plano de estudo ---------- */
// Sugestão calculada na hora, por regras fixas (sem IA): distribui sessões nos dias antes de cada
// prova ou entrega. Só as sessões marcadas como feitas são guardadas, em config.estudoFeito.
const PLANO_PADRAO = { dias:[0,1,2,3,4,5,6], antes:7, sessoes:4, minutos:60 };
const planoCfg = () => ({ ...PLANO_PADRAO, ...(S.config.plano || {}) });
function planoEstudo(){
  const cfg = planoCfg(), hoje = hojeISO(), feito = S.config.estudoFeito || {}, carga = {}, porDia = {};
  const add = (dia, it) => { (porDia[dia] ||= []).push(it); };
  S.provas.filter(p => p.data && diasAte(p.data) > 0 && num(p.nota) == null).sort((a,b) => a.data.localeCompare(b.data)).forEach(p => {
    const feitos = feito[p.id] || [];
    feitos.filter(d => d >= hoje).forEach(d => add(d, { p, feito:true }));
    // dias possíveis: de hoje até a véspera, dentro da antecedência, nos dias da semana escolhidos
    const cand = [];
    for (let n = Math.min(cfg.antes, diasAte(p.data)); n >= 1; n--){
      const d = parseD(p.data); d.setDate(d.getDate() - n);
      if (cfg.dias.includes(d.getDay()) && !feitos.includes(isoDe(d))) cand.push(isoDe(d));
    }
    const meta = p.tipo === "prova" ? cfg.sessoes : Math.max(1, cfg.sessoes - 1);
    const alvo = Math.max(0, Math.min(meta - feitos.length, cand.length));
    const escolhidos = [];
    const livre = j => j >= 0 && j < cand.length && !escolhidos.includes(j) && (carga[cand[j]] || 0) < 2;
    for (let k = 0; k < alvo; k++){
      let i = Math.round((k + 1) * cand.length / alvo) - 1;   // espalha por igual e sempre inclui a véspera
      if (!livre(i)){                                          // dia cheio: usa o dia livre mais próximo
        let achou = -1;
        for (let o = 1; o < cand.length && achou < 0; o++) achou = livre(i - o) ? i - o : livre(i + o) ? i + o : -1;
        if (achou >= 0) i = achou; else if (escolhidos.includes(i)) continue;
      }
      escolhidos.push(i); carga[cand[i]] = (carga[cand[i]] || 0) + 1;
    }
    escolhidos.forEach(i => add(cand[i], { p, feito:false }));
  });
  return Object.keys(porDia).sort().map(dia => ({ dia, itens: porDia[dia] }));
}
function rotuloSessao(p, dia){
  const vespera = Math.round((parseD(p.data) - parseD(dia)) / 86400000) === 1;
  if (p.tipo === "prova") return vespera ? "Revisão final" : "Estudar";
  return vespera ? "Finalizar e revisar" : "Adiantar";
}

          <span><span class="dot" style="background:${esc(corDe(it.p.materiaId))}"></span> <b>${esc(nomeDe(it.p.materiaId))}</b> · ${rotuloSessao(it.p, d.dia)}

/* ---------- anotações e links ---------- */
// aceita só endereços http/https; sem "https://" na frente, ele é colocado
function linkSeguro(u){
  let t = String(u || "").trim(); if (!t) return null;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(t)) t = "https://" + t;
  try { const x = new URL(t); return /^https?:$/.test(x.protocol) ? x.href : null; } catch(e){ return null; }
}
const nomeLink = l => l.titulo || l.url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
function blocoNotas(m){
  const links = (m.links || []).filter(l => linkSeguro(l.url));
  return `<div class="notas">
    ${links.length ? `<div class="links">${links.map(l => `<a href="${esc(linkSeguro(l.url))}" target="_blank" rel="noopener noreferrer">${esc(nomeLink(l))}</a>`).join("")}</div>` : ""}
    ${m.anotacoes ? `<div class="nota-txt">${esc(m.anotacoes)}</div>` : ""}
    <button class="ghost" data-acao="notas" data-id="${m.id}">${links.length || m.anotacoes ? "Editar anotações e links" : "+ Anotações e links"}</button></div>`;
}
function abrirNotas(id){
  const m = mat(id); if (!m) return;
  const frm = $("#frm");
  const linhaLink = (l = {}, i) => `<div class="link-ed"><input name="lt" placeholder="Nome (ex.: Moodle)" value="${esc(l.titulo||"")}" aria-label="Nome do link">
    <input name="lu" id="lu${i}" inputmode="url" placeholder="Endereço (ex.: moodle.uem.br)" value="${esc(l.url||"")}" aria-label="Endereço do link">
    <button type="button" class="ghost" data-tira aria-label="Tirar link">✕</button></div>`;
  frm.innerHTML = `<h2>${esc(m.nome)}</h2>
    <div class="field"><label for="n_txt">Anotações</label><textarea id="n_txt" rows="6" placeholder="Combinados com o professor, sala, critérios de avaliação…">${esc(m.anotacoes||"")}</textarea></div>
    <div class="field"><span class="label" style="text-transform:none;letter-spacing:0;font-size:.82rem">Links</span>
      <div id="n_links">${(m.links||[]).map(linhaLink).join("")}</div>
      <button type="button" id="n_add" style="align-self:flex-start">+ Link</button></div>
    <p class="erro" id="erro" role="alert" hidden></p>
    <div class="actions"><span></span><div class="r"><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Salvar</button></div></div>`;
  let n = (m.links||[]).length;
  $("#n_add").onclick = () => { $("#n_links").insertAdjacentHTML("beforeend", linhaLink({}, n++)); $("#n_links").lastElementChild.querySelector("input").focus(); };
  $("#n_links").onclick = e => { if (e.target.closest("[data-tira]")) e.target.closest(".link-ed").remove(); };
  frm.onsubmit = async e => { e.preventDefault();
    const links = [];
    for (const row of frm.querySelectorAll(".link-ed")){
      const [t, u] = row.querySelectorAll("input"), titulo = t.value.trim(), url = u.value.trim();
      if (!url){ if (titulo){ mostrarErro(u.id, `Falta o endereço do link "${titulo}".`); return; } continue; }
      const ok = linkSeguro(url);
      if (!ok){ mostrarErro(u.id, `"${url}" não parece um endereço de site.`); return; }
      links.push({ titulo, url: ok });
    }
    const { id:_, ...resto } = m;
    if (await salvar("materias", id, { ...resto, anotacoes: $("#n_txt").value.trim(), links })){ $("#dlg").close(); toast("Salvo"); }
  };
  $("#cancel").onclick = () => $("#dlg").close();
  $("#dlg").showModal();
}

const optMaterias = () => S.materias.map(m => [m.id, m.nome]);
const FORMS = {

    {duo:[{k:"data",l:"Dia",t:"date",def:hojeISO},{k:"dataFim",l:"Até (opcional)",t:"date"}]},

};

function campoHTML(c, v){
  const id = "f_"+c.k, val = v ?? (typeof c.def==="function"?c.def():c.def) ?? "";
  if (c.t==="select"){ const o = typeof c.opts==="function"?c.opts():c.opts;
    return `<div class="field"><label for="${id}">${c.l}</label><select id="${id}" name="${c.k}">${o.map(([a,b])=>`<option value="${esc(a)}" ${String(val)===String(a)?"selected":""}>${esc(b)}</option>`).join("")}</select></div>`; }
  if (c.t==="check") return `<div class="field check"><input type="checkbox" id="${id}" name="${c.k}" ${val?"checked":""}><label for="${id}">${c.l}</label></div>`;
  if (c.t==="area") return `<div class="field"><label for="${id}">${c.l}</label><textarea id="${id}" name="${c.k}">${esc(val)}</textarea></div>`;
  if (c.t==="cor"){ const cur = val || CORES[S.materias.length % CORES.length];
    return `<div class="field"><span class="label" style="text-transform:none;letter-spacing:0;font-size:.82rem">${c.l}</span><div class="swatches">${CORES.map((h,i)=>`<input type="radio" name="cor" id="cor${i}" value="${h}" ${h===cur?"checked":""}><label for="cor${i}" style="background:${h}" title="${h}"></label>`).join("")}</div></div>`; }
  const type = c.t==="num"?"text":c.t;
  return `<div class="field"><label for="${id}">${c.l}</label><input id="${id}" name="${c.k}" type="${type}" ${c.t==="num"?'inputmode="decimal"':""} value="${esc(val)}" ${c.req?"required":""} placeholder="${esc(c.ph||"")}">${c.hint?`<span class="need">${c.hint}</span>`:""}</div>`;
}

// devolve [campo, mensagem] no primeiro problema, ou null se está tudo certo
function validar(col, out, raw){
  for (const c of FORMS[col].campos.flatMap(c => c.duo || [c]))
    if (c.t==="num" && String(raw[c.k] ?? "").trim() !== "" && out[c.k] == null) return [c.k, `${c.l.split(" (")[0]}: use só números.`];
  if (col==="materias" && out.cargaHoraria != null && out.cargaHoraria <= 0) return ["cargaHoraria", "O total de aulas precisa ser maior que zero."];
  if (col==="cronograma"){
    if (!out.inicio || !out.fim) return [out.inicio ? "fim" : "inicio", "Informe o horário de início e de fim."];
    if (out.fim <= out.inicio) return ["fim", "O fim precisa ser depois do início."];
  }
  if (col==="faltas"){
    if (!out.data) return ["data", "Informe a data da falta."];
    if (out.aulas == null || out.aulas < 1) return ["aulas", "Informe quantas aulas você perdeu (1 ou mais)."];
  }
  if (col==="eventos"){
    if (!out.data) return ["data", "Informe o dia do evento."];
    if (out.dataFim && out.dataFim < out.data) return ["dataFim", "O último dia precisa ser igual ou depois do primeiro."];
  }
  if (col==="provas"){
    if (out.notaMax == null || out.notaMax <= 0) return ["notaMax", "Informe quanto a avaliação vale (maior que zero)."];
    if (out.peso == null || out.peso <= 0) return ["peso", "O peso precisa ser maior que zero."];
    if (out.nota != null && (out.nota < 0 || out.nota > out.notaMax)) return ["nota", `A nota precisa ficar entre 0 e ${fmt(out.notaMax)}.`];
  }
  return null;
}
function mostrarErro(campoId, msg){
  const e = $("#erro"); e.textContent = msg; e.hidden = false;
  document.getElementById(campoId)?.focus();
}

function abrirForm(col, id, preset={}){
  const F = FORMS[col], item = id ? S[col].find(x=>x.id===id) : null;
  if (col!=="materias" && col!=="eventos" && !S.materias.length){ toast("Cadastre uma matéria primeiro."); location.hash="#materias"; return; }
  const dados = { ...preset, ...(item||{}) };
  const campos = F.campos.map(c => c.duo ? `<div class="duo">${c.duo.map(d=>campoHTML(d,dados[d.k])).join("")}</div>` : campoHTML(c, dados[c.k])).join("");
  const frm = $("#frm");
  frm.innerHTML = `<h2>${id?"Editar":F.masc?"Novo":"Nova"} ${F.titulo.toLowerCase()}</h2>${campos}
    <p class="erro" id="erro" role="alert" hidden></p>
    <div class="actions">${id?`<button type="button" class="danger" id="del">Excluir</button>`:"<span></span>"}
      <div class="r"><button type="button" id="cancel">Cancelar</button><button type="submit" class="primary">Salvar</button></div></div>`;
  frm.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(frm), out = {}, raw = {};
    const todos = F.campos.flatMap(c => c.duo || [c]);
    todos.forEach(c => { if (c.t==="check") out[c.k] = fd.has(c.k); else { let v = fd.get(c.k) ?? ""; raw[c.k] = v; if (c.t==="num") v = num(v); out[c.k] = v; } });
    const erro = validar(col, out, raw);
    if (erro){ mostrarErro("f_"+erro[0], erro[1]); return; }
    if (col==="cronograma") out.dia = +out.dia;
    // mantém os campos que o formulário não mostra (anotações, links, marca de exemplo)
    const { id:_, ...resto } = item || {};
    const ok = await salvar(col, id, { ...resto, ...out });
    if (ok){ $("#dlg").close(); toast("Salvo"); }
  };
  $("#cancel").onclick = () => $("#dlg").close();
  const del = $("#del");
  // apagar uma matéria leva junto os blocos, faltas e provas dela
  const deps = col==="materias" ? ["cronograma","faltas","provas"].flatMap(c => S[c].filter(x => x.materiaId === id).map(x => [c, x.id])) : [];
  if (del) del.onclick = async () => {
    if (del.dataset.arm){
      del.disabled = true;
      for (const [c, i] of deps) await apagar(c, i);
      await apagar(col, id); $("#dlg").close(); toast("Excluído"); return;
    }
    del.dataset.arm = 1;
    del.textContent = deps.length ? `Confirmar: apaga também ${deps.length} ${deps.length>1?"itens":"item"} dela` : "Confirmar exclusão";
    setTimeout(() => { if (del.isConnected){ delete del.dataset.arm; del.textContent = "Excluir"; } }, 3500);
  };
  $("#dlg").showModal();
}

// "Faltei hoje": registra a falta de hoje em várias matérias de uma vez.
// Já vêm marcadas as matérias com aula hoje no cronograma; o número de aulas sai da duração do bloco (50 min por aula).
function abrirFaltei(){
  if (!S.materias.length){ toast("Cadastre uma matéria primeiro."); location.hash="#materias"; return; }
  const hoje = hojeISO(), dia = new Date().getDay(), aulasHoje = {};
  S.cronograma.filter(b => +b.dia === dia && b.tipo === "aula" && b.inicio && b.fim).forEach(b => {
    const [h1,m1] = b.inicio.split(":").map(Number), [h2,m2] = b.fim.split(":").map(Number);
    aulasHoje[b.materiaId] = (aulasHoje[b.materiaId] || 0) + Math.max(1, Math.round(((h2*60+m2) - (h1*60+m1)) / 50));
  });
  const jaTem = id => S.faltas.some(f => f.materiaId === id && f.data === hoje);
  const lista = [...S.materias].sort((a,b) => (aulasHoje[b.id] ? 1 : 0) - (aulasHoje[a.id] ? 1 : 0));
  const frm = $("#frm");
  frm.innerHTML = `<h2>Faltei hoje</h2>
    <p class="need"><b>${fmtData(hoje)}</b> · Marque as matérias e confira quantas aulas você perdeu em cada uma.</p>
    <div class="faltei">${lista.map(m => `<div class="row">
      <label class="est manter"><input type="checkbox" name="fm" id="fm_${m.id}" value="${m.id}" ${aulasHoje[m.id] && !jaTem(m.id) ? "checked" : ""}>
        <span><span class="dot" style="background:${esc(m.cor)}"></span> ${esc(m.nome)}
        ${jaTem(m.id) ? '<span class="chip warn">já registrada hoje</span>' : aulasHoje[m.id] ? '<span class="chip">aula hoje</span>' : ""}</span></label>
      <input class="qtd" id="fq_${m.id}" inputmode="numeric" value="${aulasHoje[m.id] || 2}" aria-label="Aulas perdidas em ${esc(m.nome)}"></div>`).join("")}</div>
    <div class="field check"><input type="checkbox" id="fJust"><label for="fJust">Falta justificada (não conta no limite)</label></div>
    <p class="erro" id="erro" role="alert" hidden></p>
    <div class="actions"><span></span><div class="r"><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Registrar</button></div></div>`;
  frm.onsubmit = async e => { e.preventDefault();
    const ids = [...frm.querySelectorAll('input[name="fm"]:checked')].map(i => i.value);
    if (!ids.length){ mostrarErro("fm_"+lista[0].id, "Marque pelo menos uma matéria."); return; }
    const itens = [];
    for (const id of ids){
      const aulas = num($("#fq_"+id).value);
      if (aulas == null || !Number.isInteger(aulas) || aulas < 1){ mostrarErro("fq_"+id, `Aulas perdidas em ${nomeDe(id)}: um número inteiro, 1 ou mais.`); return; }
      itens.push({ materiaId:id, data:hoje, aulas, justificada:$("#fJust").checked, obs:"" });
    }
    let n = 0;
    for (const it of itens) if (await salvar("faltas", null, it)) n++;
    if (n){ $("#dlg").close(); toast(n === 1 ? "Falta registrada" : `Falta registrada em ${n} matérias`); }
  };
  $("#cancel").onclick = () => $("#dlg").close();
  $("#dlg").showModal();
}

// Simulador de nota: testa notas imaginárias sem salvar nada.
function abrirSimulador(materiaId){
  if (!S.materias.length){ toast("Cadastre uma matéria primeiro."); location.hash="#materias"; return; }
  let mid = mat(materiaId) ? materiaId : mat(filtroProvas) ? filtroProvas : (S.materias.find(m => S.provas.some(p => p.materiaId === m.id)) || S.materias[0]).id;
  const frm = $("#frm");
  const desenhar = () => {
    const its = S.provas.filter(p => p.materiaId === mid).sort((a,b) => (a.data||"9").localeCompare(b.data||"9"));
    frm.innerHTML = `<h2>Simular nota</h2>
      <p class="need">Digite notas de mentira para ver como fica sua média. Nada aqui é salvo.</p>
      <div class="field"><label for="simMat">Matéria</label><select id="simMat">${S.materias.map(m => `<option value="${m.id}" ${m.id===mid?"selected":""}>${esc(m.nome)}</option>`).join("")}</select></div>
      ${its.length ? `<div class="faltei">${its.map(p => { const n = num(p.nota), mx = num(p.notaMax) || 10; return `<div class="row">
        <div class="grow"><div class="t">${esc(p.titulo)}</div><div class="m">${rotProva(p.tipo)} · peso ${fmt(num(p.peso)??1)} · ${n!=null?"nota real "+fmt(n):"sem nota"}</div></div>
        <input class="qtd" data-sim="${p.id}" inputmode="decimal" value="${n!=null?esc(fmt(n)):""}" placeholder="?" aria-label="Nota em ${esc(p.titulo)} (de 0 a ${fmt(mx)})">
        <span class="need">/${fmt(mx)}</span></div>`; }).join("")}</div>
        <div class="panel" id="simRes" aria-live="polite"></div>`
      : '<p class="empty">Esta matéria ainda não tem provas ou trabalhos. Cadastre na aba Provas para simular.</p>'}
      <div class="actions">${its.length?'<button type="button" class="ghost" id="simLimpa">Voltar às notas reais</button>':"<span></span>"}<div class="r"><button type="button" id="cancel">Fechar</button></div></div>`;
    $("#cancel").onclick = () => $("#dlg").close();
    $("#simMat").onchange = e => { mid = e.target.value; desenhar(); };
    if (!its.length) return;
    const calcular = () => {
      let erro = "";
      const sim = its.map(p => { const el = frm.querySelector(`[data-sim="${p.id}"]`), mx = num(p.notaMax) || 10, raw = el.value.trim(), n = num(raw);
        const ruim = raw !== "" && (n == null || n < 0 || n > mx);
        el.setAttribute("aria-invalid", ruim); if (ruim && !erro) erro = `${p.titulo}: use um número de 0 a ${fmt(mx)}.`;
        return { ...p, nota: ruim ? null : n }; });
      const r = calcNotas(sim), min = S.config.mediaMin;
      const frase = r.media == null ? "Preencha pelo menos uma nota."
        : r.resta === 0 ? (r.media >= min ? `Passa por nota: média final ${fmt(r.media)}.` : `Abaixo da média mínima de ${fmt(min)}: faltariam ${fmt(min - r.media)} pontos.`)
        : r.precisa <= 0 ? "A média mínima já está garantida, mesmo tirando 0 no que falta."
        : r.precisa > 10 ? "Com essas notas, não dá para chegar na média mínima."
        : `Para fechar com ${fmt(min)}, você precisa de <b class="num">${fmt(r.precisa)}</b> (de 10) em média no que ficou em branco.`;
      $("#simRes").innerHTML = `<div class="bar" style="margin:0"><div><div class="label">Média ${r.resta ? "até agora" : "final"}</div>${chipMedia(r.media)}</div><div class="need" style="flex:1 1 200px">${frase}</div></div>
        ${erro ? `<p class="erro" role="alert" style="margin-top:8px">${esc(erro)}</p>` : ""}`;
    };
    frm.oninput = e => { if (e.target.dataset.sim) calcular(); };
    $("#simLimpa").onclick = desenhar;
    calcular();
  };
  frm.onsubmit = e => e.preventDefault();
  frm.oninput = null;
  desenhar();
  $("#dlg").showModal();
}

// Baixa o backup. Devolve true quando o arquivo foi entregue.
async function baixarBackup(){
  const data = JSON.stringify({ app:"meu-semestre", versao:1, ...Object.fromEntries(COLS.map(c=>[c,S[c]])), config:S.config }, null, 2);
  const nome = "meu-semestre-"+hojeISO()+".json";
  if (!window.claude){
    // fora do Claude (site próprio ou arquivo aberto no navegador): download direto
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type:"application/json" }));
    a.download = nome; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    marcarBackup(); render(); toast("Backup baixado"); return true;
  }
  const dl = await window.claude?.use?.("downloads").catch(()=>null);
  if (!dl){ try { await navigator.clipboard.writeText(data); toast("Backup copiado. Cole num arquivo .json"); return true; } catch(e){ toast("Não foi possível baixar aqui."); return false; } }
  try { await dl.save({ filename:nome, data }); toast("Backup salvo"); return true; }
  catch(e){ if (e.code!=="declined") toast("Não foi possível salvar o arquivo."); return false; }
}
// Novo semestre: guarda um backup, mantém as matérias marcadas (as anuais) com tudo que é delas
// e apaga as outras, junto com os eventos que já passaram.
function abrirNovoSemestre(){
  const frm = $("#frm");
  frm.innerHTML = `<h2>Começar novo semestre</h2>
    <p class="need">Marque as matérias que <b>continuam</b>, como as anuais. Elas ficam como estão, com aulas, notas e faltas. As outras são apagadas com tudo que é delas, e os eventos que já passaram também.</p>
    <div class="field">${S.materias.length ? S.materias.map(m => `<label class="est manter"><input type="checkbox" name="manter" value="${m.id}"><span><span class="dot" style="background:${esc(m.cor)}"></span> ${esc(m.nome)}</span></label>`).join("") : '<span class="need">Nenhuma matéria cadastrada.</span>'}</div>
    <p class="need" id="nsResumo"></p>
    <p class="erro" id="erro" role="alert" hidden></p>
    <div class="actions"><span></span><div class="r"><button type="button" id="cancel">Cancelar</button><button type="submit" class="danger" id="nsOk">Baixar backup e limpar</button></div></div>`;
  const plano = () => {
    const manter = new Set([...frm.querySelectorAll('input[name="manter"]:checked')].map(i => i.value));
    const sai = S.materias.filter(m => !manter.has(m.id)).map(m => m.id);
    const lista = [
      ...["cronograma","faltas","provas"].flatMap(c => S[c].filter(x => sai.includes(x.materiaId) || !mat(x.materiaId)).map(x => [c, x.id])),
      ...S.eventos.filter(e => diasAte(e.dataFim || e.data || hojeISO()) < 0).map(e => ["eventos", e.id]),
      ...sai.map(id => ["materias", id]),
    ];
    return { sai, lista };
  };
  const ok = $("#nsOk");
  const resumo = () => { if (!ok.isConnected) return; const { sai, lista } = plano(); delete ok.dataset.arm; ok.textContent = "Baixar backup e limpar";
    $("#nsResumo").textContent = lista.length ? `Serão apagados ${lista.length} itens: ${sai.length} ${sai.length===1?"matéria":"matérias"} e o que pertence a ${sai.length===1?"ela":"elas"}, mais eventos passados.` : "Nada a apagar."; };
  frm.onchange = resumo; resumo();
  frm.onsubmit = async e => { e.preventDefault();
    const { lista } = plano();
    if (!lista.length){ mostrarErro("nsOk", "Não há nada para apagar."); return; }
    if (!ok.dataset.arm){ ok.dataset.arm = 1; ok.textContent = `Confirmar: apagar ${lista.length} itens`; return; }
    ok.disabled = true;
    if (!(await baixarBackup())){ ok.disabled = false; mostrarErro("nsOk", "O backup não foi salvo, então nada foi apagado."); return; }
    const provasFora = new Set(lista.filter(([c]) => c === "provas").map(([, id]) => id));
    for (const [c, id] of lista) await apagar(c, id);
    const feito = Object.fromEntries(Object.entries(S.config.estudoFeito || {}).filter(([id]) => !provasFora.has(id)));
    await salvarConfig({ ...S.config, estudoFeito: feito });
    $("#dlg").close(); toast("Novo semestre pronto"); };
  $("#cancel").onclick = () => $("#dlg").close();
}
function abrirBackup(){
  const frm = $("#frm");
  frm.innerHTML = `<h2>Backup dos seus dados</h2>
    <p class="need">Baixe um arquivo com matérias, cronograma, faltas e notas. Guarde no seu computador ou Drive. Para restaurar, importe o arquivo aqui.</p>
    <button type="button" class="primary" id="bkDown">Baixar backup (.json)</button>
    <div class="field"><label for="bkFile">Importar backup</label><input type="file" id="bkFile" accept=".json,application/json"><span class="need">Junta com o que já existe; itens com o mesmo código são substituídos.</span></div>
    <div class="actions"><button type="button" class="ghost" id="novoSem">Começar novo semestre…</button><div class="r"><button type="button" id="cancel">Fechar</button></div></div>`;
  frm.onsubmit = e => e.preventDefault();
  $("#cancel").onclick = () => $("#dlg").close();
  $("#bkDown").onclick = baixarBackup;
  $("#novoSem").onclick = abrirNovoSemestre;
  $("#bkFile").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = async () => {
      let d; try { d = JSON.parse(rd.result); } catch(_){ toast("Arquivo inválido: não é um backup do Meu Semestre."); return; }
      if (d.app!=="meu-semestre"){ toast("Arquivo inválido: não é um backup do Meu Semestre."); return; }
      let n = 0;
      for (const c of COLS) for (const {id, ...x} of (d[c]||[])) { if (await salvar(c, id, x)) n++; }
      if (d.config) await salvarConfig(d.config);
      marcarBackup(); render();
      $("#dlg").close(); toast(n+" itens importados");
    };
    rd.readAsText(f);
  };
  $("#dlg").showModal();
}

/* ---------- agenda (.ics) ---------- */
// Gera um arquivo de calendário com as provas e entregas futuras. O UID é fixo por item,
// então importar de novo atualiza os eventos em vez de duplicar.
function gerarICS(){
  const txt = v => String(v ?? "").replace(/\\/g,"\\\\").replace(/[,;]/g,"\\$&").replace(/\r?\n/g,"\\n");
  const dia = iso => iso.replace(/-/g,"");
  const seguinte = iso => { const d = parseD(iso); d.setDate(d.getDate()+1); return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"); };
  const agora = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  // linhas longas são quebradas, como o formato pede
  const dobrar = l => { const ch = [...l], partes = []; while (ch.length > 60) partes.push(ch.splice(0, 60).join("")); partes.push(ch.join("")); return partes.join("\r\n "); };
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Meu Semestre//PT-BR","CALSCALE:GREGORIAN","X-WR-CALNAME:Meu Semestre"];
  const itens = [
    ...S.provas.filter(p => p.data && diasAte(p.data) >= 0).map(p => ({ id:p.id, data:p.data, fim:p.data, titulo:p.titulo, resumo:`${p.titulo} · ${nomeDe(p.materiaId)}`, conteudo:p.conteudo })),
    ...S.eventos.filter(e => e.data && diasAte(e.dataFim || e.data) >= 0).map(e => ({ id:e.id, data:e.data, fim:e.dataFim || e.data, titulo:e.titulo, resumo:e.titulo, conteudo:e.obs })),
  ].sort((a,b) => a.data.localeCompare(b.data));
  itens.forEach(p => {
    L.push("BEGIN:VEVENT", "UID:"+p.id+"@meu-semestre", "DTSTAMP:"+agora,
      "DTSTART;VALUE=DATE:"+dia(p.data), "DTEND;VALUE=DATE:"+seguinte(p.fim),
      "SUMMARY:"+txt(p.resumo));
    if (p.conteudo) L.push("DESCRIPTION:"+txt(p.conteudo));
    // avisos às 9h: uma semana antes e na véspera
    L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+txt(p.titulo+" em uma semana"),"TRIGGER:-P6DT15H","END:VALARM",
           "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+txt(p.titulo+" amanhã"),"TRIGGER:-PT15H","END:VALARM","END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return { n: itens.length, ics: L.map(dobrar).join("\r\n") + "\r\n" };
}
function exportarAgenda(){
  const { n, ics } = gerarICS();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type:"text/calendar" }));
  a.download = "meu-semestre.ics"; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`${n} ${n>1?"eventos":"evento"} no arquivo. Abra para adicionar à agenda.`);
}

/* ---------- render e rotas ---------- */
const VIEWS = { painel:vPainel, cronograma:vCronograma, provas:vProvas, faltas:vFaltas, materias:vMaterias };
function rota(){ const h = location.hash.slice(1); return VIEWS[h] ? h : "painel"; }
let renderPend = false;
function render(){
  if (renderPend) return; renderPend = true;
  requestAnimationFrame(() => {
    renderPend = false;
    const r = rota();
    document.querySelectorAll("#tabs a").forEach(a => { if (a.getAttribute("href")==="#"+r) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
    $("#view").innerHTML = mode==="carregando" ? vCarregando() : VIEWS[r]();
    $("#tabs a[aria-current]")?.scrollIntoView({ inline:"nearest", block:"nearest" });
    navFade();
  });
}
// mostra um esmaecido na direita quando ainda há abas escondidas
function navFade(){ const n = $("#tabs"); n.classList.toggle("mais", n.scrollWidth - n.clientWidth - n.scrollLeft > 4); }
$("#tabs").addEventListener("scroll", navFade, { passive:true });
window.addEventListener("resize", navFade);

$("#view").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.novo) abrirForm(b.dataset.novo, null, { ...(b.dataset.dia!=null ? {dia:b.dataset.dia} : {}), ...(b.dataset.data ? {data:b.dataset.data} : {}) });
  else if (b.dataset.vis){ visCron = b.dataset.vis; try { localStorage.setItem("meu-semestre-vis", visCron); } catch(e){} render(); }
  else if (b.dataset.mes){ const n = +b.dataset.mes, h = new Date(); mesRef = n ? new Date(mesRef.getFullYear(), mesRef.getMonth()+n, 1) : new Date(h.getFullYear(), h.getMonth(), 1); render(); }
  else if (b.dataset.edit) abrirForm(b.dataset.edit, b.dataset.id);
  else if (b.id==="cfg") abrirConfig();
  else if (b.dataset.acao==="backup") abrirBackup();
  else if (b.dataset.acao==="agenda") exportarAgenda();
  else if (b.dataset.acao==="plano") abrirPlano();
  else if (b.dataset.acao==="faltei") abrirFaltei();
  else if (b.dataset.acao==="notas") abrirNotas(b.dataset.id);
  else if (b.dataset.acao==="simular") abrirSimulador(b.dataset.mat);
  else if (b.id==="limparEx"){
    if (!b.dataset.arm){ b.dataset.arm=1; b.textContent="Confirmar: apagar exemplos"; return; }
    b.disabled = true;
    for (const c of COLS) for (const x of S[c].filter(x=>x.exemplo)) await apagar(c, x.id);
    toast("Exemplos apagados");
  }
});
$("#view").addEventListener("change", e => {
  if (e.target.id==="fProva"){ filtroProvas = e.target.value; render(); }
  else if (e.target.dataset.estudo) marcarEstudo(e.target.dataset.estudo, e.target.dataset.dia, e.target.checked);
});
window.addEventListener("hashchange", render);
$("#bkp").onclick = abrirBackup;

/* ---------- modo aplicativo ---------- */
// Só no site hospedado (http/https): liga o manifesto (nome e ícone do app) e o service worker (abre sem internet).
// Aberto direto do arquivo ou dentro do Claude, nada disso é usado.
if (FORA_DO_CLAUDE && location.protocol.startsWith("http")){
  [["manifest","manifest.webmanifest"],["apple-touch-icon","apple-touch-icon.png"],["icon","icon-192.png"]].forEach(([rel, href]) => {
    const l = document.createElement("link"); l.rel = rel; l.href = href; document.head.append(l); });
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  // Android e computador: o navegador avisa quando dá para instalar, e mostramos o botão "Instalar"
  let pedido = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); pedido = e; $("#instalar").hidden = false; });
  window.addEventListener("appinstalled", () => { pedido = null; $("#instalar").hidden = true; toast("App instalado"); });
  $("#instalar").onclick = async () => { if (!pedido) return; pedido.prompt(); await pedido.userChoice.catch(() => {}); pedido = null; $("#instalar").hidden = true; };
}

$("#hoje").textContent = new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
render();
iniciar();
})();
