    <button type="button" class="primary" id="lmAgenda" ${temAgenda() ? "" : "disabled"}>${temAgenda() ? "Baixar arquivo da agenda" : "Nada com data à frente"}</button>
    <h3 style="margin-top:16px">Com o site aberto: notificação</h3>
    ${temNotif ? `<label class="est manter" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="lmNotif" ${avisos.ligado && podeNotificar() ? "checked" : ""}> Avisar o que vence hoje e amanhã, uma vez por dia, quando abrir o site</label>
      <p class="need" id="lmInfo">${Notification.permission === "denied" ? "As notificações estão bloqueadas para este site. Libere nas configurações do navegador." : ""}</p>`
      : `<p class="need">Este navegador não mostra notificações. No iPhone, elas só funcionam com o site instalado como aplicativo.</p>`}
    <div class="actions"><span></span><div class="r"><button type="button" id="cancel">Fechar</button></div></div>`;
  frm.onsubmit = e => e.preventDefault();
  $("#cancel").onclick = () => $("#dlg").close();
  $("#lmAgenda").onclick = exportarAgenda;
  const cx = $("#lmNotif");
  if (cx) cx.onchange = async () => {
    if (!cx.checked){ avisos.ligado = false; guardarAvisos(); return; }
    const r = Notification.permission === "granted" ? "granted" : await Notification.requestPermission().catch(() => "denied");
    if (r !== "granted"){ cx.checked = false; $("#lmInfo").textContent = "Sem permissão para notificar. Libere nas configurações do navegador."; return; }
    avisos.ligado = true; avisos.ultimo = null; guardarAvisos();
    const l = vencendo();
    notificar("Lembretes ligados", l.length ? l.slice(0, 5).join("\n") : "Nada vence hoje ou amanhã.");
    avisos.ultimo = hojeISO(); guardarAvisos();
  };
  $("#dlg").showModal();
}

function exportarAgenda(){
  const { n, ics } = gerarICS();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type:"text/calendar" }));
  a.download = "meu-semestre.ics"; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`${n} ${n>1?"eventos":"evento"} no arquivo. Abra para adicionar à agenda.`);
}

/* ---------- render e rotas ---------- */
const TITULOS = { painel:"Hoje", cronograma:"Cronograma", provas:"Provas e notas", faltas:"Faltas", materias:"Matérias" };
const VIEWS = { painel:vPainel, cronograma:vCronograma, provas:vProvas, faltas:vFaltas, materias:vMaterias };
function rota(){ const h = location.hash.slice(1); return VIEWS[h] ? h : "painel"; }
let renderPend = false;
function render(){
  if (renderPend) return; renderPend = true;
  requestAnimationFrame(() => {
    renderPend = false;
    const r = rota();
    document.querySelectorAll("#tabs a").forEach(a => { if (a.getAttribute("href")==="#"+r) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
    $("#titulo").textContent = TITULOS[r];
    $("#view").innerHTML = mode==="carregando" ? vCarregando() : VIEWS[r]();
    // quadro com cabeçalho: o título fica fora e o resto entra num .grupo (lista agrupada, como no iPhone)
    $("#view").querySelectorAll(".panel").forEach(p => { const h = p.firstElementChild;
      if (!h || !h.matches(".bar,h3") || !h.nextElementSibling) return;
      const g = document.createElement("div"); g.className = "grupo";
      while (h.nextSibling) g.append(h.nextSibling);
      p.append(g); p.classList.add("sec"); });
  });
}

$("#view").addEventListener("click", async e => {
  let b = e.target.closest("button");
  if (!b){ // toque em qualquer ponto da linha abre a edição (menos em link, caixinha e campo)
    if (e.target.closest("a,input,label,select,summary")) return;
    const r = e.target.closest(".row"); b = r && (r.dataset.edit ? r : r.querySelector(":scope > button[data-edit]"));
    if (!b) return;
  }
  if (b.dataset.novo) abrirForm(b.dataset.novo, null, { ...(b.dataset.mat ? {materiaId:b.dataset.mat} : {}), ...(b.dataset.dia!=null ? {dia:b.dataset.dia} : {}), ...(b.dataset.data ? {data:b.dataset.data} : {}) });
  else if (b.dataset.vis){ visCron = b.dataset.vis; try { localStorage.setItem("meu-semestre-vis", visCron); } catch(e){} render(); }
  else if (b.dataset.mes){ const n = +b.dataset.mes, h = new Date(); mesRef = n ? new Date(mesRef.getFullYear(), mesRef.getMonth()+n, 1) : new Date(h.getFullYear(), h.getMonth(), 1); render(); }
  else if (b.dataset.edit) abrirForm(b.dataset.edit, b.dataset.id);
  else if (b.id==="cfg") abrirConfig();
  else if (b.dataset.acao==="backup") abrirBackup();
  else if (b.dataset.acao==="agenda") exportarAgenda();
  else if (b.dataset.acao==="lembretes") abrirLembretes();
  else if (b.dataset.acao==="plano") abrirPlano();
  else if (b.dataset.acao==="faltei") abrirFaltei();
  else if (b.dataset.acao==="todasFaltas") abrirTodasFaltas();
  else if (b.dataset.acao==="anotacoes") abrirAnotacoes(b.dataset.mat || "");
  else if (b.dataset.acao==="periodo") abrirPeriodo();
  else if (b.dataset.acao?.startsWith("foco")) acaoFoco(b.dataset.acao);
  else if (b.dataset.hist) apagarHistorico(b);
  else if (b.dataset.acao==="notas") abrirNotas(b.dataset.id);
  else if (b.dataset.acao==="simular") abrirSimulador(b.dataset.mat);
  else if (b.id==="limparEx"){
    if (!b.dataset.arm){ b.dataset.arm=1; b.textContent="Confirmar: apagar exemplos"; return; }
    b.disabled = true;
    for (const c of COLS) for (const x of S[c].filter(x=>x.exemplo)) await apagar(c, x.id);
    toast("Exemplos apagados");
  }
});
// deslizar uma tarefa para a esquerda apaga; o aviso oferece Desfazer
let desl = null;
$("#view").addEventListener("touchstart", e => {
  const r = e.target.closest(".tarefa"); desl = null;
  if (r && e.touches.length === 1) desl = { r, x:e.touches[0].clientX, y:e.touches[0].clientY, dx:0, lado:null };
}, { passive:true });
$("#view").addEventListener("touchmove", e => {
  if (!desl) return;
  const dx = e.touches[0].clientX - desl.x, dy = e.touches[0].clientY - desl.y;
  if (desl.lado == null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) desl.lado = Math.abs(dx) > Math.abs(dy) && dx < 0;
  if (!desl.lado) return;
  desl.dx = Math.max(dx, -160); desl.r.classList.add("desl");
  desl.r.style.transition = "none"; desl.r.style.transform = `translateX(${Math.min(0, desl.dx)}px)`;
}, { passive:true });
const fimDesl = async () => {
  const d = desl; desl = null; if (!d || !d.lado) return;
  d.r.style.transition = ""; d.r.style.transform = "";
  if (d.dx > -90){ setTimeout(() => d.r.classList.remove("desl"), 250); return; }
  const t = S.tarefas.find(x => x.id === d.r.querySelector("[data-tarefa]")?.dataset.tarefa); if (!t) return;
  const { id:_, _t, ...resto } = t;
  await apagar("tarefas", t.id);
  toast("Tarefa apagada", "Desfazer", () => salvar("tarefas", null, resto));
};
$("#view").addEventListener("touchend", fimDesl);
$("#view").addEventListener("touchcancel", fimDesl);
$("#view").addEventListener("change", e => {
  if (e.target.id==="fProva"){ filtroProvas = e.target.value; render(); }
  else if (e.target.dataset.tarefa) marcarTarefa(e.target.dataset.tarefa, e.target.checked);
  else if (e.target.dataset.estudo) marcarEstudo(e.target.dataset.estudo, e.target.dataset.dia, e.target.checked);
});
window.addEventListener("hashchange", render);
$("#bkp").onclick = abrirBackup;

// Trava a rolagem da página enquanto a janela (#dlg) está aberta. No iPhone, só esconder a barra
// de rolagem não basta: a página é "presa" no lugar e volta para a mesma posição ao fechar.
{
  let posicao = 0;
  new MutationObserver(() => {
    const aberto = $("#dlg").open, body = document.body;
    if (aberto && !body.classList.contains("travada")){
      posicao = scrollY; body.style.top = -posicao + "px"; body.classList.add("travada");
    } else if (!aberto && body.classList.contains("travada")){
      body.classList.remove("travada"); body.style.top = ""; scrollTo(0, posicao);
    }
  }).observe($("#dlg"), { attributes:true, attributeFilter:["open"] });
}

/* ---------- busca ---------- */
// Procura em tudo pelo texto, ignorando acentos e maiúsculas ("calculo" acha "Cálculo").
const semAcento = t => String(t ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function itensBusca(){
  const sub = id => nomeDe(id);
  return [
    ...S.materias.map(m => ({ col:"materias", id:m.id, tipo:"Matéria", t:m.nome, sub:m.professor || "", cor:m.cor, txt:[m.nome, m.professor] })),
    ...S.materias.filter(m => m.anotacoes || (m.links || []).length).map(m => ({ col:"notas", id:m.id, tipo:"Anotações", t:m.nome, sub:"", cor:m.cor,
        txt:[m.anotacoes, ...(m.links || []).flatMap(l => [l.titulo, l.url])], trecho:m.anotacoes })),
    ...S.provas.map(p => ({ col:"provas", id:p.id, tipo:rotProva(p.tipo), t:p.titulo, sub:sub(p.materiaId) + (p.data ? " · " + fmtData(p.data) : ""), cor:corDe(p.materiaId), txt:[p.titulo, p.conteudo, sub(p.materiaId)], trecho:p.conteudo })),
    ...S.tarefas.map(x => ({ col:"tarefas", id:x.id, tipo:x.feita ? "Tarefa feita" : "Tarefa", t:x.titulo, sub:sub(x.materiaId) + (x.data ? " · até " + fmtData(x.data) : ""), cor:corDe(x.materiaId), txt:[x.titulo, sub(x.materiaId)] })),
    ...S.eventos.map(e => ({ col:"eventos", id:e.id, tipo:"Evento", t:e.titulo, sub:periodo(e), cor:"#6b7a8f", txt:[e.titulo, e.obs], trecho:e.obs })),
    ...S.cronograma.filter(b => b.topico).map(b => ({ col:"cronograma", id:b.id, tipo:rotTipo(b.tipo), t:b.topico, sub:sub(b.materiaId) + " · " + DIAS[b.dia], cor:corDe(b.materiaId), txt:[b.topico] })),
    ...S.anotacoes.map(a => ({ col:"anotacoes", id:a.id, tipo:"Anotação", t:String(a.texto || "").split("\n")[0].slice(0, 60), sub:[a.materiaId ? sub(a.materiaId) : "", quandoAnot(a.criada)].filter(Boolean).join(" · "),
        cor:a.materiaId ? corDe(a.materiaId) : "#8e8e93", txt:[a.texto, a.materiaId ? sub(a.materiaId) : ""], trecho:a.texto })),
    ...S.faltas.filter(f => f.obs).map(f => ({ col:"faltas", id:f.id, tipo:"Falta", t:f.obs, sub:sub(f.materiaId) + " · " + fmtData(f.data), cor:corDe(f.materiaId), txt:[f.obs] })),
  ];
}
// mostra o pedaço do texto em volta do que foi achado, com o termo destacado
function destacar(texto, q){
  const t = String(texto ?? ""), i = semAcento(t).indexOf(q);
  if (i < 0) return esc(t);
  return esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length));
}
function trechoDe(texto, q){
  const t = String(texto ?? "").replace(/\s+/g, " "), i = semAcento(t).indexOf(q);
  if (i < 0) return "";
  const ini = Math.max(0, i - 30);
  return (ini ? "…" : "") + destacar(t.slice(ini, i + q.length + 50), q) + (i + q.length + 50 < t.length ? "…" : "");
}
function resultadosBusca(q){
  q = semAcento(q.trim());
  if (!q) return '<p class="empty">Digite para procurar em matérias, provas, tarefas, eventos, cronograma e anotações.</p>';
  const ach = itensBusca().filter(it => it.txt.some(x => semAcento(x).includes(q)));
  if (!ach.length) return '<p class="empty">Nada encontrado.</p>';
  return `<div class="list">${ach.slice(0, 40).map(it => `<button type="button" class="row achado" data-col="${it.col}" data-id="${it.id}">
      <span class="dot" style="background:${esc(it.cor)}"></span>
      <span class="grow"><span class="t">${destacar(it.t, q)}</span> <span class="chip">${esc(it.tipo)}</span>
        ${it.sub ? `<span class="m" style="display:block">${esc(it.sub)}</span>` : ""}
        ${it.trecho && !semAcento(it.t).includes(q) ? `<span class="m" style="display:block">${trechoDe(it.trecho, q)}</span>` : ""}</span></button>`).join("")}</div>
    ${ach.length > 40 ? `<p class="need">Mostrando 40 de ${ach.length}. Digite mais para filtrar.</p>` : ""}`;
}
function abrirBusca(){
  const frm = $("#frm");
  frm.innerHTML = `<h2>Buscar</h2>
    <div class="field"><label for="q_busca" class="sr">Buscar</label><input id="q_busca" type="search" autocomplete="off" placeholder="Ex.: P1, lista, cálculo" value="${esc(abrirBusca.ultima || "")}"></div>
    <div id="q_res">${resultadosBusca(abrirBusca.ultima || "")}</div>
    <div class="actions"><span></span><div class="r"><button type="button" id="cancel">Fechar</button></div></div>`;
  frm.onsubmit = e => e.preventDefault();
  $("#cancel").onclick = () => $("#dlg").close();
  const q = $("#q_busca");
  q.oninput = () => { abrirBusca.ultima = q.value; $("#q_res").innerHTML = resultadosBusca(q.value); };
  $("#q_res").onclick = e => {
    const b = e.target.closest(".achado"); if (!b) return;
    $("#dlg").close();
    if (b.dataset.col === "notas") abrirNotas(b.dataset.id);
    else abrirForm(b.dataset.col, b.dataset.id);
  };
  $("#dlg").showModal(); q.focus(); q.select();
}
{ // botão no topo (antes do Backup) e atalho "/" ou Ctrl+K no computador
  const b = document.createElement("button"); b.className = "topo-btn"; b.id = "buscar"; b.setAttribute("aria-label", "Buscar"); b.title = "Buscar";
  b.innerHTML = svgI('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.3-4.3"/>');
  $("#bkp").before(b); b.onclick = abrirBusca;
  document.addEventListener("keydown", e => {
    const digitando = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
    if ((e.key === "/" && !digitando) || (e.key.toLowerCase() === "k" && (e.ctrlKey || e.metaKey))){
      if ($("#dlg").open) return;
      e.preventDefault(); abrirBusca();
    }
  });
}

/* ---------- aparência: tema claro/escuro e cor do app ---------- */
// Automático segue o tema do celular ou computador. Claro e Escuro fixam a escolha neste aparelho.
// A cor do app também fica só neste aparelho (não entra no backup nem na sincronização).
const LS_TEMA = "meu-semestre-tema", TEMAS = [
  ["", "Automático", svgI('<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17A8.5 8.5 0 0 0 12 3.5z" fill="currentColor"/>')],
  ["light", "Claro", svgI('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>')],
  ["dark", "Escuro", svgI('<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>')]];
// [valor guardado, nome, cor da bolinha]. O azul é a cor padrão, por isso o valor dele é vazio.
const LS_COR = "meu-semestre-cor", CORES_APP = [["", "Azul", "#7fa3c4"], ["bordo", "Bordô", "#8f2440"]];
let tema = "", corApp = ""; try { tema = localStorage.getItem(LS_TEMA) || ""; corApp = localStorage.getItem(LS_COR) || ""; } catch(e){}
if (!CORES_APP.some(c => c[0] === corApp)) corApp = "";
const corBarra = document.querySelectorAll('meta[name="theme-color"]'), corOriginal = [...corBarra].map(m => m.content);
function aplicarTema(){
  const [valor, nome, icone] = TEMAS.find(t => t[0] === tema) || TEMAS[0];
  if (valor) document.documentElement.dataset.theme = valor;
  else if (FORA_DO_CLAUDE) delete document.documentElement.dataset.theme;
  if (corApp) document.documentElement.dataset.cor = corApp; else delete document.documentElement.dataset.cor;
  // cor da barra do navegador e do app instalado
  corBarra.forEach((m, i) => m.content = valor ? (valor === "dark" ? "#000000" : "#f2f2f7") : corOriginal[i]);
  $("#tema").innerHTML = icone;
  return nome;
}
function guardar(chave, valor){ try { valor ? localStorage.setItem(chave, valor) : localStorage.removeItem(chave); } catch(e){} }
function abrirAparencia(){
  const frm = $("#frm");
  frm.innerHTML = `<h2 tabindex="-1" autofocus>Aparência</h2>
    <div class="field"><span class="label">Tema</span><div class="seg cheia" id="ap_tema">${TEMAS.map(t => `<button type="button" data-v="${t[0]}">${t[1]}</button>`).join("")}</div></div>
    <div class="field"><span class="label">Cor do app: <span id="ap_nome"></span></span><div class="swatches">${CORES_APP.map((c, i) =>
      `<input type="radio" name="ap_cor" id="ap_cor${i}" value="${c[0]}"><label for="ap_cor${i}" style="background:${c[2]}" title="${c[1]}" aria-label="${c[1]}"></label>`).join("")}</div></div>
    <p class="need">A escolha vale só neste aparelho. Dá para trocar quando quiser.</p>
    <div class="actions"><div class="r" style="flex:1"><button class="primary" type="button" id="cancel" style="flex:1">Pronto</button></div></div>`;
  const marcar = () => {
    frm.querySelectorAll("#ap_tema button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === tema));
    frm.querySelectorAll('[name="ap_cor"]').forEach(r => r.checked = r.value === corApp);
    $("#ap_nome").textContent = (CORES_APP.find(c => c[0] === corApp) || CORES_APP[0])[1];
  };
  frm.querySelectorAll("#ap_tema button").forEach(b => b.onclick = () => { tema = b.dataset.v; guardar(LS_TEMA, tema); aplicarTema(); marcar(); });
  frm.querySelectorAll('[name="ap_cor"]').forEach(r => r.onchange = () => { corApp = r.value; guardar(LS_COR, corApp); aplicarTema(); marcar(); });
  $("#cancel").onclick = () => $("#dlg").close();
  frm.onsubmit = e => e.preventDefault();
  marcar();
  $("#dlg").showModal();
}
$("#tema").onclick = abrirAparencia;
aplicarTema();
$("#sinc").onclick = botaoSinc;

/* ---------- modo aplicativo ---------- */
// Só no site hospedado (http/https): liga o manifesto (nome e ícone do app) e o service worker (abre sem internet).
// Aberto direto do arquivo ou dentro do Claude, nada disso é usado.
if (FORA_DO_CLAUDE && location.protocol.startsWith("http")){
  [["manifest","manifest.webmanifest"],["apple-touch-icon","apple-touch-icon.png"],["icon","icon-192.png"]].forEach(([rel, href]) => {
    const l = document.createElement("link"); l.rel = rel; l.href = href; document.head.append(l); });
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  // Android e computador: o navegador avisa quando dá para instalar, e mostramos o botão "Instalar"
  let pedido = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); pedido = e; $("#instalar").hidden = false; });
  window.addEventListener("appinstalled", () => { pedido = null; $("#instalar").hidden = true; toast("App instalado"); });
  $("#instalar").onclick = async () => { if (!pedido) return; pedido.prompt(); await pedido.userChoice.catch(() => {}); pedido = null; $("#instalar").hidden = true; };
}

$("#hoje").textContent = new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
render();
iniciar();
})();
