<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Semestre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Semestre">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
// aplica o tema escolhido antes de desenhar a página, para não piscar claro
try { const t = localStorage.getItem("meu-semestre-tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  const c = localStorage.getItem("meu-semestre-cor"); if (c) document.documentElement.dataset.cor = c; } catch(e){}
</script>
<style>
/* Visual no padrão dos apps do iPhone: título grande, listas agrupadas em quadros sobre fundo cinza,
   barra de abas embaixo no celular (pílula flutuante no topo em telas largas). A cor do app é escolhida no botão Aparência (azul do iPhone 14 por padrão). */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#e9e9ee; --line:rgba(60,60,67,.2);
  --fg:#000000; --muted:#6c6c70; --ink:#8e8e93;
  --accent:var(--c-claro); --accent-fill:var(--c-fundo); --accent-ink:#ffffff; --accent-bg:var(--c-claro-bg); --accent-txt:var(--c-claro);
  --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.24);
  --barra:rgba(249,249,249,.82); --folha:#f2f2f7; --campo:#ffffff;
  --ok:#1a7f3c; --warn:#946200; --bad:#c9281e;
  --ok-bg:rgba(52,199,89,.16); --warn-bg:rgba(255,159,10,.18); --bad-bg:rgba(255,59,48,.13);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --r:14px; --mola:cubic-bezier(.16,1,.3,1);
  /* cor do app (azul é a padrão). Cada cor tem: texto no claro, texto no escuro, fundo de botão e o degradê do quadro principal */
  --c-claro:#2d5f8b; --c-claro-bg:rgba(86,134,178,.16); --c-escuro:#a9c7e2; --c-escuro-bg:rgba(160,190,218,.22); --c-fundo:#3a6c9a;
  --w-1:#c9d9e8; --w-2:#9db6cd; --w-ink:#10263c;
}
:root[data-cor="bordo"]{--c-claro:#8f2440; --c-claro-bg:rgba(143,36,64,.12); --c-escuro:#e8607f; --c-escuro-bg:rgba(232,96,127,.2); --c-fundo:#a12a4a; --w-1:#a42d4d; --w-2:#6f1a31; --w-ink:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --line:rgba(84,84,88,.6);
  --fg:#ffffff; --muted:#98989f; --ink:#8e8e93;
  --accent:var(--c-escuro); --accent-fill:var(--c-fundo); --accent-ink:#ffffff; --accent-bg:var(--c-escuro-bg); --accent-txt:var(--c-escuro);
  --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
  --barra:rgba(22,22,24,.8); --folha:#1c1c1e; --campo:#2c2c2e;
  --ok:#30d158; --warn:#ffb340; --bad:#ff6961;
  --ok-bg:rgba(48,209,88,.18); --warn-bg:rgba(255,159,10,.2); --bad-bg:rgba(255,69,58,.2); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --line:rgba(84,84,88,.6);
  --fg:#ffffff; --muted:#98989f; --ink:#8e8e93;
  --accent:var(--c-escuro); --accent-fill:var(--c-fundo); --accent-ink:#ffffff; --accent-bg:var(--c-escuro-bg); --accent-txt:var(--c-escuro);
  --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
  --barra:rgba(22,22,24,.8); --folha:#1c1c1e; --campo:#2c2c2e;
  --ok:#30d158; --warn:#ffb340; --bad:#ff6961;
  --ok-bg:rgba(48,209,88,.18); --warn-bg:rgba(255,159,10,.2); --bad-bg:rgba(255,69,58,.2); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;scrollbar-color:var(--fill-2) transparent}
::selection{background:var(--accent-bg)}
input,textarea{caret-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
svg.i{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cabeçalho: data pequena, título grande da aba e ações */
header{padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
/* faixa sólida, da cor do fundo, atrás da hora e da bateria (app instalado no iPhone): o conteúdo rolado some por baixo dela */
body::after{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:30;pointer-events:none;
  background:var(--bg)}
.dt{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:32px}
/* botões redondos do topo (tema, sincronizar, buscar, backup), como os ícones da barra dos apps do iPhone */
.dt .filter{gap:10px}
header button.topo-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;min-width:38px;min-height:38px;padding:0;border:0;border-radius:50%;background:var(--fill);color:var(--accent);cursor:pointer;flex:none}
header button.topo-btn:hover{background:var(--fill-2)}
header button.topo-btn svg{width:20px;height:20px}
header button.topo-btn[hidden]{display:none}
#hoje{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
h1{font-family:var(--f-display);font-weight:700;font-size:2.125rem;line-height:1.15;letter-spacing:-.022em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.8rem}
#status{text-align:center;margin-block:0;padding-bottom:28px}
.erro{color:var(--bad);font-size:.9rem;font-weight:500;margin:0}

/* abas: pílula flutuante no topo (telas largas) */
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:6;display:flex;gap:2px;width:fit-content;max-width:calc(100% - 32px);margin:10px auto 0;padding:4px;border-radius:999px;
  background:var(--barra);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 0 0 .5px var(--line),0 10px 30px -14px rgba(0,0,0,.35)}
nav a{padding:8px 16px;border-radius:999px;color:var(--fg);text-decoration:none;font-weight:500;font-size:.94rem;white-space:nowrap}
nav a:hover{background:var(--fill)}
nav a[aria-current="page"]{background:var(--accent-fill);color:var(--accent-ink);font-weight:600}
nav svg{display:none}

main{padding-block:16px 28px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.375rem;letter-spacing:-.02em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:-.02em;margin:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:26px 18px}
.grid2>*{min-width:0}
/* quadro; com cabeçalho, o título fica fora e o conteúdo vai para dentro do .grupo */
.panel{background:var(--surface);border-radius:var(--r);padding:14px 16px}
.panel h3{margin-bottom:10px}
.panel.sec{background:none;padding:0;border-radius:0}
.panel.sec>.bar,.panel.sec>h3{margin:0 4px 8px!important;min-height:36px}
.panel.sec>.bar h3{margin:0}
button.row.anot{padding:11px 0;min-height:44px}
.anot{width:100%;text-align:left;background:none;border:0;border-radius:0;color:inherit;font:inherit;cursor:pointer}
.anot-txt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.grupo{background:var(--surface);border-radius:var(--r);padding:4px 16px;overflow:hidden}
.grupo>.empty,.grupo>.need{padding:12px 0;margin:0}
.grupo>.foco{padding:12px 0}
.label{font-size:.8rem;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);font-weight:500}
.num{font-variant-numeric:tabular-nums}

button{font:inherit;font-weight:600;font-size:.94rem;letter-spacing:-.01em;cursor:pointer;border:0;border-radius:999px;background:var(--fill);color:var(--accent);padding:7px 14px}
button:hover{background:var(--fill-2)}
button:active{opacity:.6}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent-fill);color:var(--accent-ink)}
button.primary:hover{background:var(--accent-fill);filter:brightness(1.08)}
button.ghost{background:transparent;color:var(--accent);padding:6px 8px;font-weight:400;font-size:1rem}
button.ghost:hover{background:var(--fill)}
button.danger{color:var(--bad)}

.notice{background:var(--surface);border-radius:var(--r);padding:12px 12px 12px 16px;color:var(--muted);font-size:.87rem;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.notice button{flex:none}
.empty{color:var(--muted);font-size:.94rem;padding:8px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.list{display:flex;flex-direction:column}
.grupo>.list,.grupo>.tbl-wrap{margin-right:-16px}
.grupo>.list>.row,.grupo>.faltei>.row{padding-right:16px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;position:relative;min-height:44px}
.row:not(:first-child)::before{content:"";position:absolute;top:0;right:0;left:var(--rec,0px);border-top:.5px solid var(--line)}
.row:has(>.dot){--rec:22px}
.row:has(>.cb){--rec:16px}
.row:has(>.ic){--rec:42px}
.row:has(>.count){--rec:60px}
.row .grow{flex:1;min-width:0}
.row .t{font-size:1.0625rem;letter-spacing:-.02em;overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.row[data-edit],.row:has(>button[data-edit]){cursor:pointer}
.row:not(.tarefa)>button.ghost[data-edit]{font-size:0;min-width:28px;padding-inline:8px 2px;color:var(--ink)}
.row:not(.tarefa)>button.ghost[data-edit]::after{content:"";display:inline-block;width:8px;height:8px;border-top:2px solid;border-right:2px solid;transform:rotate(45deg);opacity:.7}
.row:has(>.pn){--rec:42px}
.pn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--fill);color:var(--muted);font:700 .94rem var(--f-num)}
.pn.ok{background:var(--accent-fill);color:var(--accent-ink)}
.list:has(>.tarefa){overflow:hidden}
.tarefa.desl{background:var(--surface)}
.tarefa.desl::after{content:"Apagar";position:absolute;left:100%;top:0;bottom:0;width:200px;display:flex;align-items:center;padding-left:18px;background:#d1362b;color:#fff;font-weight:600}
.toast button{min-height:0!important;padding:0 0 0 12px!important;font-weight:600;background:none}
.cb{width:4px;align-self:stretch;min-height:34px;border-radius:2px;flex:none}
.ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.ic svg{width:18px;height:18px;stroke-width:2.2}
.hr{color:var(--muted);font-size:.94rem;font-variant-numeric:tabular-nums;text-align:right;line-height:1.25}
.dd{font-size:.9rem;font-weight:500;color:var(--muted);background:var(--fill);border-radius:999px;padding:4px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dd.sem{color:var(--accent);background:var(--accent-bg);font-weight:600}
.dd.perto{color:var(--bad);background:var(--bad-bg);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--fill);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.hl{background:var(--accent-bg);color:var(--accent)}
.meter{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:3px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.94rem}
th{text-align:left;font-size:.8rem;color:var(--muted);font-weight:500;padding:10px 8px 6px 0;border-bottom:.5px solid var(--line)}
td{padding:11px 8px 11px 0;border-bottom:.5px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}

/* widgets do topo do Painel */
.wg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:26px}
.w{background:var(--surface);border-radius:22px;padding:14px 16px;min-height:112px;display:flex;flex-direction:column;min-width:0}
.w .k{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:.82rem;font-weight:600;color:var(--accent)}
.w b{font-family:var(--f-display);font-size:1.25rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:auto;overflow-wrap:anywhere;text-wrap:balance}
.w p{margin:3px 0 0;font-size:.84rem;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.w .gr{font-family:var(--f-num);font-size:2.25rem;font-weight:700;letter-spacing:-.02em;line-height:1;margin-top:auto;font-variant-numeric:tabular-nums}
.w .gr i{font-style:normal;font-family:var(--f-body);font-size:1.0625rem;font-weight:600;color:var(--muted);letter-spacing:-.01em;margin-left:4px}
.w.vazio{min-height:0}
.w.vazio b{margin-top:10px;font-size:1.0625rem}
.w.tinta{background:linear-gradient(160deg,var(--w-1),var(--w-2));color:var(--w-ink)}
.w.tinta .k,.w.tinta p{color:var(--w-ink);opacity:.8}

/* cronograma: semana */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.day{background:var(--surface);border-radius:var(--r);padding:10px;min-height:120px;display:flex;flex-direction:column;gap:6px}
.day h3{font-size:1.0625rem;display:flex;justify-content:space-between;align-items:center;padding-left:4px}
.day h3 button{font-size:1.4rem;line-height:1;padding:2px 8px;font-weight:300}
.day h3 .need{font-weight:400;font-size:.84rem;letter-spacing:0}
.day.today h3>span{color:var(--accent)}
.day.today h3>span::after{content:"hoje";margin-left:8px;font:600 .72rem var(--f-body);letter-spacing:0;padding:2px 8px;border-radius:999px;background:var(--accent-bg);vertical-align:2px}
.blk{background:color-mix(in srgb,var(--c,var(--ink)) 14%,var(--surface));color:var(--fg);border-radius:8px;padding:7px 10px 7px 13px;font-size:.9rem;font-weight:400;text-align:left;width:100%;position:relative;overflow:hidden}
.blk::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c,var(--ink))}
.blk:hover{background:color-mix(in srgb,var(--c,var(--ink)) 22%,var(--surface))}
.blk .h{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.blk .n{font-weight:600;overflow-wrap:anywhere}
.blk .p{color:var(--muted);overflow-wrap:anywhere}
.day>.need{padding:4px}
@media (max-width:760px){.week{grid-template-columns:1fr;overflow-x:visible}.day{min-height:0}}
/* controle segmentado */
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{border-radius:7px;background:transparent;color:var(--fg);font-weight:500;padding:5px 16px}
.seg button:hover{background:transparent}
.seg button:focus-visible{outline-offset:-2px}
.seg.cheia{display:flex}
.seg.cheia button{flex:1;padding-left:4px;padding-right:4px}
dialog h2:focus{outline:none}
.seg button[aria-pressed="true"],.seg button[aria-pressed="true"]:hover{background:var(--surface);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#636366}}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#636366}
/* cronograma: mês */
.mesnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mesnav h2{min-width:9.5em}
@media (max-width:700px){.mesnav{flex-wrap:nowrap;width:100%}.mesnav h2{min-width:0;flex:1}.mesnav button{padding-inline:14px!important}}
.mes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.mh{padding:10px 2px 6px;font-size:.72rem;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center}
.mc{border-top:.5px solid var(--line);min-height:98px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.mc.fora .mn{color:var(--muted);opacity:.55}
.mn{background:transparent;color:var(--fg);padding:0;width:30px;height:30px;border-radius:50%;font-size:1rem;font-weight:400;font-variant-numeric:tabular-nums;align-self:center}
.mc.hoje .mn,.mc.hoje .mn:hover{background:var(--accent-fill);color:var(--accent-ink);font-weight:600}
.mi{border:1px solid transparent;border-radius:5px;padding:2px 6px;font-size:.72rem;font-weight:500;text-align:left;line-height:1.3;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:none;color:var(--fg)}
button.mi-prova,button.mi-prova:hover{background:var(--accent-fill);color:var(--accent-ink)}
button.mi-entrega,button.mi-entrega:hover{border-color:var(--accent);background:transparent;color:var(--accent)}
button.mi-evento,button.mi-evento:hover{background:var(--surface-2)}
button.mi-folga,button.mi-folga:hover{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.mc.folga{background:color-mix(in srgb,var(--warn-bg) 55%,var(--surface))}
.chip.folga{background:var(--warn-bg);color:var(--warn);white-space:normal}
.leg-folga{background:var(--warn-bg)}
.blk.cancelada{opacity:.55;text-decoration:line-through}
.mi:hover{filter:brightness(.94)}
.leg{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:0 4px 26px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:14px;height:10px;border-radius:3px;border:1px solid transparent}
@media (max-width:760px){.mc{min-height:62px;padding:4px;gap:3px}.mi{height:6px;padding:0;border-radius:3px}.mi .mt{display:none}}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .t{font-size:1.0625rem;letter-spacing:-.02em}
.card>.t::before,.card .bar .t::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.stats{display:flex;gap:18px 22px;flex-wrap:wrap}
.stat .label{text-transform:none;letter-spacing:0;font-size:.84rem}
.stat .v{font-family:var(--f-num);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.evols{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px 22px}
.evol{margin:0}
.evol figcaption{display:flex;justify-content:space-between;align-items:center;font-weight:500;margin-bottom:4px}
.evol svg{width:100%;height:auto;display:block;overflow:visible}
.evol .grade{stroke:var(--line);stroke-width:1}
.evol .minima{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.evol .eixo{fill:var(--muted);font:11px var(--f-body)}
.evol .eixo.min{fill:var(--fg);font-weight:600}
.evol .alvo{fill:transparent;cursor:pointer;outline:none}
.evol .alvo:focus-visible{stroke:var(--accent);stroke-width:2}
section:has(.evols){position:relative}

  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 0 0 .5px var(--line),0 10px 30px -10px rgba(0,0,0,.35);

    padding:6px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  nav a,nav a:hover,nav a[aria-current="page"]{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px;background:none;color:var(--ink);font-size:.69rem;font-weight:500;border-radius:8px}
  nav a[aria-current="page"]{color:var(--accent)}

  nav .lg{display:none}
  .dt{flex-wrap:wrap;gap:0}
  .dt .filter{flex:1 0 100%;justify-content:flex-end;flex-wrap:nowrap;gap:10px;margin:4px 0 6px}
  #hoje{order:2}

}

  button,nav a{transition:background-color .15s,opacity .15s}
  .tarefa{transition:transform .25s var(--mola)}
  dialog[open]{animation:sobe .4s var(--mola)}

}

<script>
(() => {
const DIAS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const DIAS_CURTO = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const CORES = ["#3b6fd8","#d9534f","#2e9e6a","#c58a12","#8a55c9","#d0679d","#1f9bb0","#6b7a8f"];
const COLS = ["materias","cronograma","faltas","provas","eventos","tarefas","sessoes","anotacoes"];
const LS_KEY = "meu-semestre-v1";
const LS_BACKUP = "meu-semestre-backup-em";
const FORA_DO_CLAUDE = !window.claude; // site próprio ou arquivo aberto no navegador

const S = { materias:[], cronograma:[], faltas:[], provas:[], eventos:[], tarefas:[], sessoes:[], anotacoes:[], config:{ mediaMin:6, freqMin:75, exameMedia:5, exameDireito:0 } };
let db = null, mode = "carregando";

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { if (v === "" || v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
const fmt = (n, d=1) => n == null ? "—" : n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const hojeISO = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fmtData = s => s ? parseD(s).toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"}) : "sem data";
const fmtCurta = s => parseD(s).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
const isoDe = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const periodo = e => e.dataFim && e.dataFim !== e.data ? `${fmtCurta(e.data)} a ${fmtCurta(e.dataFim)}` : fmtData(e.data);
const diasAte = s => Math.round((parseD(s) - parseD(hojeISO())) / 86400000);
const mat = id => S.materias.find(m => m.id === id);
const corDe = id => mat(id)?.cor || "#6b7a8f";
const nomeDe = id => mat(id)?.nome || "Sem matéria";
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
// aviso rápido no pé da tela; "acao" é um botão opcional, como Desfazer
function toast(msg, acao, fn){ const t=$("#toast"); t.textContent=msg;
  if (acao){ const b=document.createElement("button"); b.className="ghost"; b.textContent=acao; b.onclick=()=>{ t.hidden=true; fn(); }; t.append(b); }
  t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true, acao ? 5000 : 2200); }

/* ---------- armazenamento ---------- */
function loadLocal(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw) Object.assign(S, JSON.parse(raw)); } catch(e){}
}
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} agendarSinc(); }

async function salvar(col, id, data){
  if (db) {
    try { id ? await db.collection(col).doc(id).set(data) : await db.collection(col).add(data); }
    catch(e){ toast(e.code === "quota_exceeded" ? "Limite de registros atingido. Apague itens antigos." : "Não foi possível salvar. Tente de novo."); return false; }
  } else {
    const arr = S[col]; const i = id ? arr.findIndex(x => x.id === id) : -1;
    // _t: quando o item mudou pela última vez (a sincronização usa para saber qual versão é a mais nova)
    if (i >= 0) arr[i] = { id, ...data, _t: Date.now() }; else arr.push({ id: id || uid(), ...data, _t: Date.now() });
    saveLocal(); render();
  }
  return true;
}
async function apagar(col, id){
  if (db) { try { await db.collection(col).doc(id).delete(); } catch(e){ toast("Não foi possível apagar."); return; } }
  else {
    S[col] = S[col].filter(x => x.id !== id);
    // anota o que foi apagado, para a sincronização não trazer o item de volta de outro aparelho
    S.apagados = { ...(S.apagados||{}), [id]: Date.now() };
    saveLocal(); render();
  }
}
async function salvarConfig(c){
  S.config = db ? c : { ...c, _t: Date.now() };
  if (db) { try { await db.doc("config/geral").set(c); } catch(e){ toast("Não foi possível salvar."); } }
  else { saveLocal(); render(); }
}

/* ---------- sincronizar com o Google Drive (opcional) ---------- */
// Guarda uma cópia dos dados numa pasta escondida do Google Drive da pessoa (a "appDataFolder"),
// que só este site enxerga. Cada aparelho junta a cópia do Drive com a sua: em cada item vale a
// versão mais nova (_t), e os itens apagados ficam anotados em S.apagados para não voltarem.
// Não há chave no código: o Client ID é colado pela pessoa e fica só no navegador dela.
const LS_SYNC = "meu-semestre-sync";
const DRIVE_ESCOPO = "https://www.googleapis.com/auth/drive.appdata";
const DRIVE_ARQ = "meu-semestre.json";
const PODE_SINC = FORA_DO_CLAUDE && location.protocol.startsWith("http");
let sinc = {}; try { sinc = JSON.parse(localStorage.getItem(LS_SYNC)) || {}; } catch(e){}
const guardarSinc = () => { try { localStorage.setItem(LS_SYNC, JSON.stringify(sinc)); } catch(e){} };
let sincRodando = false, sincDeNovo = false, sincTimer = null, aplicando = false;

function carregarGoogle(){
  if (window.google?.accounts?.oauth2) return Promise.resolve();
  if (!carregarGoogle.p) carregarGoogle.p = new Promise((ok, erro) => {
    const sc = document.createElement("script"); sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;
    sc.onload = ok; sc.onerror = () => { carregarGoogle.p = null; sc.remove(); erro(new Error("sem-google")); };
    document.head.append(sc);
  });
  return carregarGoogle.p;
}
const tokenValido = () => sinc.token && sinc.expira > Date.now() + 60000;
// Abre a janelinha do Google. Precisa ser chamada direto de um toque, senão o navegador bloqueia.
function pedirToken(){
  return new Promise((ok, erro) => {
    if (!window.google?.accounts?.oauth2) return erro(new Error("sem-google"));
    google.accounts.oauth2.initTokenClient({
      client_id: sinc.clientId, scope: DRIVE_ESCOPO, prompt: "",
      callback: r => {
        if (r.error || !r.access_token) return erro(new Error(r.error || "negado"));
        sinc.token = r.access_token; sinc.expira = Date.now() + (+r.expires_in || 3600) * 1000; guardarSinc(); ok();
      },
      error_callback: e => erro(new Error(e?.type || "cancelado")),
    }).requestAccessToken();
  });
}
async function drive(url, opts = {}){
  const r = await fetch(url, { ...opts, headers: { Authorization: "Bearer " + sinc.token, ...(opts.headers || {}) } });
  if (r.status === 401){ sinc.token = null; guardarSinc(); throw new Error("token"); }
  if (!r.ok) throw new Error("drive " + r.status);
  return r;
}
async function lerDrive(){
  if (!sinc.fileId){
    const q = encodeURIComponent(`name='${DRIVE_ARQ}'`);
    const r = await (await drive(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&orderBy=createdTime&q=${q}`)).json();
    if (!r.files?.length) return null;
    sinc.fileId = r.files[0].id; guardarSinc();
  }
  try { return await (await drive(`https://www.googleapis.com/drive/v3/files/${sinc.fileId}?alt=media`)).json(); }
  catch(e){ if (e.message === "drive 404"){ sinc.fileId = null; guardarSinc(); return lerDrive(); } throw e; }
}
async function escreverDrive(d){
  const corpo = JSON.stringify(d);
  if (sinc.fileId){
    await drive(`https://www.googleapis.com/upload/drive/v3/files/${sinc.fileId}?uploadType=media`, { method:"PATCH", headers:{ "Content-Type":"application/json" }, body:corpo });
    return;
  }
  const fd = new FormData();
  fd.append("metadata", new Blob([JSON.stringify({ name:DRIVE_ARQ, parents:["appDataFolder"] })], { type:"application/json" }));
  fd.append("file", new Blob([corpo], { type:"application/json" }));
  const r = await (await drive("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", { method:"POST", body:fd })).json();

// mesmo formato e mesma ordem de campos, para comparar duas cópias
const normal = d => ({ apagados: d.apagados || {}, ...Object.fromEntries(COLS.map(c => [c, d[c] || []])), config: d.config || null });
function juntar(local, remoto){
  const limite = Date.now() - 180 * 86400000, apagados = {};
  for (const [id, t] of [...Object.entries(remoto.apagados || {}), ...Object.entries(local.apagados || {})])
    if (t > limite) apagados[id] = Math.max(t, apagados[id] || 0);
  const out = { apagados };
  for (const c of COLS){
    const m = new Map();
    // em empate fica a versão deste aparelho
    for (const x of [...(remoto[c] || []), ...(local[c] || [])]){ const y = m.get(x.id); if (!y || (x._t || 0) >= (y._t || 0)) m.set(x.id, x); }
    out[c] = [...m.values()].filter(x => !(apagados[x.id] >= (x._t || 0)));
  }
  out.config = (remoto.config?._t || 0) > (local.config?._t || 0) ? remoto.config : local.config;
  return out;
}
function statusSinc(tipo, msg){

    : tipo === "pendente" ? "Toque em Sincronizar"
    : msg || "Erro ao sincronizar";
}
function agendarSinc(){
  if (aplicando || !PODE_SINC || !sinc.conectado) return;
  clearTimeout(sincTimer); sincTimer = setTimeout(() => sincronizar(false), 2000);

// interativo = veio de um toque, então pode abrir a janelinha do Google se o acesso venceu
async function sincronizar(interativo){
  if (!PODE_SINC || !sinc.clientId) return false;
  if (sincRodando){ sincDeNovo = true; return false; }
  sincRodando = true;
  try {
    if (!tokenValido()){
      if (!interativo){ statusSinc("pendente"); return false; }
      await pedirToken();
    }
    statusSinc("rodando");
    const remoto = await lerDrive() || {};
    const local = { apagados: S.apagados || {}, ...Object.fromEntries(COLS.map(c => [c, S[c]])), config: S.config };
    const junto = juntar(local, remoto), txt = JSON.stringify(normal(junto));
    if (txt !== JSON.stringify(normal(remoto))) await escreverDrive({ app:"meu-semestre", versao:1, ...junto });
    if (txt !== JSON.stringify(normal(local))){
      COLS.forEach(c => S[c] = junto[c]);
      S.apagados = junto.apagados;
      if (junto.config) S.config = { mediaMin:6, freqMin:75, exameMedia:5, exameDireito:0, ...junto.config };
      aplicando = true; saveLocal(); aplicando = false; render();
    }
    sinc.ultima = Date.now(); guardarSinc(); statusSinc("ok");
    return true;
  } catch(e){
    statusSinc("erro", e.message === "sem-google" || e instanceof TypeError ? "Sem internet: sincroniza depois"
      : e.message === "token" ? "Toque em Sincronizar para entrar de novo"
      : /cancel|negado|popup|access_denied/.test(e.message) ? "Entrada no Google cancelada" : "Erro ao sincronizar");
    return false;
  } finally {
    sincRodando = false;
    if (sincDeNovo){ sincDeNovo = false; agendarSinc(); }
  }
}

function resumoNotas(materiaId){ return calcNotas(S.provas.filter(p => p.materiaId === materiaId)); }
// média ponderada das avaliações com nota e quanto falta tirar nas outras para chegar na média mínima
function calcNotas(its){
  let soma = 0, pesoFeito = 0, pesoTotal = 0;
  its.forEach(p => {
    const peso = num(p.peso) ?? 1; pesoTotal += peso;
    const n = num(p.nota), mx = num(p.notaMax) || 10;
    if (n != null) { soma += (n / mx) * 10 * peso; pesoFeito += peso; }
  });
  const media = pesoFeito ? soma / pesoFeito : null;
  const resta = pesoTotal - pesoFeito;
  let precisa = null;
  if (resta > 0) precisa = (S.config.mediaMin * pesoTotal - soma) / resta;
  return { media, precisa, resta, n: its.length };
}
// exame final: média final = (média do semestre + nota do exame) ÷ 2.
// Só vale quando todas as avaliações têm nota e a média ficou abaixo da mínima.
function calcExame(n){
  if (!n.n || n.resta > 0 || n.media == null || n.media >= S.config.mediaMin) return null;
  const minFinal = num(S.config.exameMedia) ?? 5, direito = num(S.config.exameDireito) ?? 0;
  if (n.media < direito) return { semDireito:true };
  // arredonda para cima na 1ª casa, para nunca mostrar menos do que o necessário
  return { precisa: Math.max(0, Math.ceil((2 * minFinal - n.media) * 10 - 1e-9) / 10) };
}
function textoExame(n){
  const e = calcExame(n);
  if (!e) return "";
  if (e.semDireito) return '<span class="chip bad">sem direito a exame</span>';
  if (e.precisa > 10) return '<span class="chip bad">não dá mais nem com exame</span>';
  return `precisa de <b class="num">${fmt(e.precisa)}</b> no exame`;
}
function resumoFaltas(materiaId){
  const m = mat(materiaId);
  const fs = S.faltas.filter(f => f.materiaId === materiaId);
  const soma = l => l.reduce((a,f) => a + (num(f.aulas) ?? 1), 0);
  // falta justificada não conta no limite
  const total = soma(fs.filter(f => !f.justificada)), just = soma(fs.filter(f => f.justificada));
  const ch = num(m?.cargaHoraria);
  const limite = ch ? Math.floor(ch * (1 - S.config.freqMin/100)) : null;
  return { total, just, limite, restam: limite != null ? limite - total : null };
}
function chipMedia(media){
  if (media == null) return '<span class="chip">sem notas</span>';
  const min = S.config.mediaMin;
  const cls = media >= min ? "ok" : media >= min - 1 ? "warn" : "bad";
  return `<span class="chip ${cls} num">${fmt(media)}</span>`;
}
// domingo da semana da data, para comparar semanas do calendário
const semanaDe = s => { const d = parseD(s); d.setDate(d.getDate() - d.getDay()); return d; };
function chipPrazo(data){
  const d = diasAte(data);
  if (d <= 3) return '<span class="chip bad">perto</span>';
  const sem = Math.round((semanaDe(data) - semanaDe(hojeISO())) / 604800000);

}

function classePrazo(data){
  if (diasAte(data) <= 3) return "perto";

/* ---------- plano de estudo ---------- */
// Sugestão calculada na hora, por regras fixas (sem IA): distribui sessões nos dias antes de cada
// prova ou entrega. Só as sessões marcadas como feitas são guardadas, em config.estudoFeito.
const PLANO_PADRAO = { dias:[0,1,2,3,4,5,6], antes:7, sessoes:4, minutos:60 };
const planoCfg = () => ({ ...PLANO_PADRAO, ...(S.config.plano || {}) });
function planoEstudo(){
  const cfg = planoCfg(), hoje = hojeISO(), feito = S.config.estudoFeito || {}, carga = {}, porDia = {};
  const add = (dia, it) => { (porDia[dia] ||= []).push(it); };
  S.provas.filter(p => p.data && diasAte(p.data) > 0 && num(p.nota) == null).sort((a,b) => a.data.localeCompare(b.data)).forEach(p => {
    const feitos = feito[p.id] || [];
    feitos.filter(d => d >= hoje).forEach(d => add(d, { p, feito:true }));
    // dias possíveis: de hoje até a véspera, dentro da antecedência, nos dias da semana escolhidos
    const cand = [];
    for (let n = Math.min(cfg.antes, diasAte(p.data)); n >= 1; n--){
      const d = parseD(p.data); d.setDate(d.getDate() - n);
      if (cfg.dias.includes(d.getDay()) && !feitos.includes(isoDe(d))) cand.push(isoDe(d));
    }
    const meta = p.tipo === "prova" ? cfg.sessoes : Math.max(1, cfg.sessoes - 1);
    const alvo = Math.max(0, Math.min(meta - feitos.length, cand.length));
    const escolhidos = [];
    const livre = j => j >= 0 && j < cand.length && !escolhidos.includes(j) && (carga[cand[j]] || 0) < 2;
    for (let k = 0; k < alvo; k++){
      let i = Math.round((k + 1) * cand.length / alvo) - 1;   // espalha por igual e sempre inclui a véspera
      if (!livre(i)){                                          // dia cheio: usa o dia livre mais próximo
        let achou = -1;
        for (let o = 1; o < cand.length && achou < 0; o++) achou = livre(i - o) ? i - o : livre(i + o) ? i + o : -1;
        if (achou >= 0) i = achou; else if (escolhidos.includes(i)) continue;
      }
      escolhidos.push(i); carga[cand[i]] = (carga[cand[i]] || 0) + 1;
    }
    escolhidos.forEach(i => add(cand[i], { p, feito:false }));
  });
  return Object.keys(porDia).sort().map(dia => ({ dia, itens: porDia[dia] }));
}
function rotuloSessao(p, dia){
  const vespera = Math.round((parseD(p.data) - parseD(dia)) / 86400000) === 1;
  if (p.tipo === "prova") return vespera ? "Revisão final" : "Estudar";
  return vespera ? "Finalizar e revisar" : "Adiantar";
}

}

function vPainel(){

    ...S.eventos.filter(e => e.data && diasAte(e.dataFim || e.data) >= 0).map(e => ({ data:e.data, t:esc(e.titulo)+exTag(e), col:"eventos", id:e.id, tipo:"evento", cor:"#8e8e93", sub:`Evento · ${periodo(e)}` })),

  const linhasMat = S.materias.map(m => {

    else need = textoExame(n);
    return `<tr>
      <td><span class="dot" style="background:${esc(m.cor)}"></span> ${esc(m.nome)}${exTag(m)}</td>
      <td>${chipMedia(n.media)}<div class="need">${need}</div></td>
      <td style="min-width:140px"><span class="num">${f.total}${f.limite!=null?" / "+f.limite:""}</span> <span class="need">aulas</span>

  return `${avisoExemplo()}

  ${widgets}
  <div class="grid2">
    <section class="panel">
      <div class="bar" style="margin-bottom:8px"><h3>${DIAS[hoje]}${folgaHoje ? ` <span class="chip folga">sem aula · ${esc(folgaHoje)}</span>` : ""}</h3><div class="filter"><button data-acao="faltei">Faltei hoje</button><button class="ghost" data-novo="cronograma" data-dia="${hoje}">+ Bloco</button></div></div>
      ${blocos.length ? `<div class="list">${blocos.map(b => `
        <div class="row" data-edit="cronograma" data-id="${b.id}"><span class="cb" style="background:${esc(corDe(b.materiaId))}"></span>
          <div class="grow"><div class="t">${esc(nomeDe(b.materiaId))}${exTag(b)}</div><div class="m">${esc(b.topico||rotTipo(b.tipo))}</div></div>

    <section class="panel">
      <div class="bar" style="margin-bottom:8px"><h3>Próximos</h3><div class="filter">${FORA_DO_CLAUDE ? '<button class="ghost" data-acao="lembretes">Lembretes</button>' : ""}<button class="ghost" data-novo="provas">+ Prova</button></div></div>
      ${proximas.length ? `<div class="list">${proximas.map(p => { const real = diasAte(p.data), d = Math.max(0, real); return `

          <div class="grow"><div class="t">${p.t}</div><div class="m">${p.sub}</div></div>

    ${S.materias.length ? `<div class="tbl-wrap"><table><thead><tr><th>Matéria</th><th>Média atual</th><th>Faltas / limite</th></tr></thead><tbody>${linhasMat}</tbody></table></div>`

  return [

    ...S.eventos.filter(e => e.data && e.data <= iso && iso <= (e.dataFim || e.data)).map(e => ({ tipo: e.semAula ? "folga" : "evento", t:e.titulo, sub:"", col:"eventos", id:e.id })),
  ];
}
const ROT_ITEM = { prova:"Prova", entrega:"Entrega", evento:"Evento", folga:"Sem aula" };

/* ---------- calendário da faculdade ---------- */
// Dias sem aula: antes do início ou depois do fim das aulas (Ajustar período) e eventos marcados
// como "Não tem aula" (feriados e recessos). Devolve o motivo, ou null quando é dia de aula normal.
function semAula(iso){
  const c = S.config;
  if (c.aulasIni && iso < c.aulasIni) return "antes do início das aulas";
  if (c.aulasFim && iso > c.aulasFim) return "aulas encerradas";
  const e = S.eventos.find(e => e.semAula && e.data && e.data <= iso && iso <= (e.dataFim || e.data));
  return e ? e.titulo : null;
}
// data deste dia da semana na semana atual (segunda a domingo)
function dataNaSemana(d){
  const seg = parseD(hojeISO()); seg.setDate(seg.getDate() - ((seg.getDay() + 6) % 7));
  seg.setDate(seg.getDate() + (d === 0 ? 6 : d - 1)); return isoDe(seg);
}
function abrirPeriodo(){
  const frm = $("#frm"), c = S.config;
  const folgas = S.eventos.filter(e => e.semAula).sort((a, b) => (a.data || "").localeCompare(b.data || ""));
  frm.innerHTML = `<h2>Calendário da faculdade</h2>
    <p class="need">Fora do período das aulas e nos feriados e recessos, o cronograma não mostra aula e o "Faltei hoje" não sugere matérias.</p>
    <div class="duo">${campoData("a_ini", "", "Início das aulas", c.aulasIni)}${campoData("a_fim", "", "Fim das aulas", c.aulasFim)}</div>
    <h3>Feriados e recessos</h3>
    ${folgas.length ? `<div class="list">${folgas.map(e => `<div class="row"><div class="grow"><div class="t">${esc(e.titulo)}</div><div class="m">${periodo(e)}</div></div>
      <button type="button" class="ghost" data-folga="${e.id}">Editar</button></div>`).join("")}</div>` : '<p class="empty">Nenhum cadastrado.</p>'}
    <button type="button" id="a_nova">+ Feriado ou recesso</button>
    <p class="erro" id="erro" role="alert" hidden></p>
    <div class="actions"><span></span><div class="r"><button type="button" id="cancel">Cancelar</button><button class="primary" type="submit">Salvar</button></div></div>`;
  $("#cancel").onclick = () => $("#dlg").close();
  $("#a_nova").onclick = () => { $("#dlg").close(); abrirForm("eventos", null, { semAula:true }); };
  frm.querySelectorAll("[data-folga]").forEach(b => b.onclick = () => { $("#dlg").close(); abrirForm("eventos", b.dataset.folga); });
  frm.onsubmit = async e => { e.preventDefault();
    const aulasIni = brParaIso($("#a_ini").value), aulasFim = brParaIso($("#a_fim").value);
    if (aulasIni == null){ mostrarErro("a_ini", "Início das aulas: data inválida. Use dd/mm/aaaa."); return; }
    if (aulasFim == null){ mostrarErro("a_fim", "Fim das aulas: data inválida. Use dd/mm/aaaa."); return; }
    if (aulasIni && aulasFim && aulasFim < aulasIni){ mostrarErro("a_fim", "O fim das aulas precisa ser depois do início."); return; }
    await salvarConfig({ ...S.config, aulasIni, aulasFim });
    $("#dlg").close(); toast("Salvo"); };
  $("#dlg").showModal();
}
function vMes(){
  const y = mesRef.getFullYear(), m = mesRef.getMonth(), hoje = hojeISO();
  const diasNoMes = new Date(y, m+1, 0).getDate(), semanas = Math.ceil((mesRef.getDay() + diasNoMes) / 7);

  for (let i = 0; i < semanas * 7; i++){
    const d = new Date(y, m, 1 - mesRef.getDay() + i), iso = isoDe(d);
    celulas += `<div class="mc ${d.getMonth()!==m?"fora":""} ${iso===hoje?"hoje":""} ${semAula(iso)?"folga":""}">
      <button class="mn" data-novo="eventos" data-data="${iso}" aria-label="Adicionar evento em ${d.getDate()} de ${d.toLocaleDateString("pt-BR",{month:"long"})}">${d.getDate()}</button>
      ${itensDoDia(iso).map(it => `<button class="mi mi-${it.tipo}" data-edit="${it.col}" data-id="${it.id}" title="${esc(ROT_ITEM[it.tipo]+": "+it.t+(it.sub?" · "+it.sub:""))}"><span class="mt">${esc(it.t)}${it.sub?" · "+esc(it.sub):""}</span></button>`).join("")}
    </div>`;
  }
  const ini = isoDe(mesRef), fim = isoDe(new Date(y, m+1, 0));
  const lista = [
    ...S.provas.filter(p => p.data && p.data >= ini && p.data <= fim).map(p => ({ data:p.data, tipo: p.tipo === "prova" ? "prova" : "entrega", t:esc(p.titulo)+exTag(p), sub:esc(nomeDe(p.materiaId))+" · "+fmtData(p.data), col:"provas", id:p.id })),
    ...S.eventos.filter(e => e.data && e.data <= fim && (e.dataFim || e.data) >= ini).map(e => ({ data:e.data, tipo: e.semAula ? "folga" : "evento", t:esc(e.titulo)+exTag(e), sub:periodo(e)+(e.obs?" · "+esc(e.obs):""), col:"eventos", id:e.id })),

  return `${avisoExemplo()}
  <div class="bar"><div class="mesnav"><h2>${mesRef.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}).replace(/^./, c => c.toUpperCase())}</h2>
      <button data-mes="-1" aria-label="Mês anterior">‹</button><button data-mes="0">Hoje</button><button data-mes="1" aria-label="Próximo mês">›</button></div>
    <div class="filter">${seletorVis()}${botaoAgenda()}<button data-acao="periodo">Feriados e período</button><button class="primary" data-novo="eventos">+ Evento</button></div></div>
  <div class="mes">${DIAS_CURTO.map(d => `<div class="mh">${d}</div>`).join("")}${celulas}</div>

  <section class="panel"><h3>Neste mês</h3>${lista.length ? `<div class="list">${lista.map(it => `
    <div class="row"><div class="count"><b>${parseD(it.data).getDate()}</b>${DIAS_CURTO[parseD(it.data).getDay()].toLowerCase()}</div>
      <div class="grow"><div class="t">${it.t} <span class="chip">${ROT_ITEM[it.tipo]}</span></div><div class="m">${it.sub}</div></div>
      <button class="ghost" data-edit="${it.col}" data-id="${it.id}">Editar</button></div>`).join("")}</div>` : '<p class="empty">Nada marcado neste mês.</p>'}</section>`;
}
function vCronograma(){
  if (visCron === "mes") return vMes();
  const hoje = new Date().getDay();
  const ordem = [1,2,3,4,5,6,0];
  const horas = S.cronograma.filter(b => b.tipo !== "aula").reduce((a,b) => {
    if (!b.inicio || !b.fim) return a; const [h1,m1]=b.inicio.split(":").map(Number), [h2,m2]=b.fim.split(":").map(Number);
    return a + Math.max(0,(h2*60+m2)-(h1*60+m1)); },0) / 60;
  return `${avisoExemplo()}
  <div class="bar"><div><div class="need">Estudo planejado: <b class="num">${fmt(horas)} h</b> por semana (sem contar aulas)</div></div>
    <div class="filter">${seletorVis()}<button data-acao="periodo">Feriados e período</button><button class="primary" data-novo="cronograma">+ Bloco</button></div></div>
  <div class="week">${ordem.map(d => {
    const bl = S.cronograma.filter(b => +b.dia === d).sort((a,b) => (a.inicio||"").localeCompare(b.inicio||""));
    const dt = dataNaSemana(d), folga = semAula(dt);
    return `<div class="day ${d===hoje?"today":""}"><h3><span>${DIAS[d]} <span class="need num">${parseD(dt).getDate()}/${parseD(dt).getMonth()+1}</span></span><button class="ghost" data-novo="cronograma" data-dia="${d}" aria-label="Adicionar em ${DIAS[d]}">+</button></h3>

      ${bl.map(b => `<button class="blk ${folga && b.tipo === "aula" ? "cancelada" : ""}" style="--c:${esc(corDe(b.materiaId))}" data-edit="cronograma" data-id="${b.id}">
        <div class="h">${esc(b.inicio||"")}–${esc(b.fim||"")} · ${rotTipo(b.tipo)}</div>
        <div class="n">${esc(nomeDe(b.materiaId))}${exTag(b)}</div>${b.topico?`<div class="p">${esc(b.topico)}</div>`:""}</button>`).join("") || '<span class="need">livre</span>'}
    </div>`; }).join("")}</div>`;
}

      ${n!=null?`<span class="big">${fmt(n)}<span class="need">/${fmt(mx)}</span></span>`:(p.data&&diasAte(p.data)<0?'<span class="chip warn">lançar nota</span>':"")}

  <div class="grid2">

    <section class="panel"><h3>Com nota</h3>${feitas.length?`<div class="list">${feitas.map(linha).join("")}</div>`:'<p class="empty">Quando lançar uma nota, ela aparece aqui.</p>'}</section>
  </div>
  ${blocoEvolucao()}`;

/* ---------- gráfico da evolução da média ---------- */
// Um gráfico pequeno por matéria: a média depois de cada avaliação com nota (em ordem de data),
// com uma linha tracejada na média mínima. Desenhado em SVG pelo próprio site, sem biblioteca.
function pontosEvolucao(materiaId){
  const com = S.provas.filter(p => p.materiaId === materiaId && num(p.nota) != null)
    .sort((a, b) => (a.data || "9").localeCompare(b.data || "9"));
  return com.map((p, i) => ({ p, media: calcNotas(com.slice(0, i + 1)).media, nota: num(p.nota) / (num(p.notaMax) || 10) * 10 }));
}
function graficoEvolucao(m){
  const pts = pontosEvolucao(m.id); if (!pts.length) return "";
  const W = 320, H = 150, L = 30, R = 12, T = 12, B = 34, min = S.config.mediaMin;
  const x = i => pts.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (10 - v) / 10 * (H - T - B);
  const ultima = pts[pts.length - 1].media, cls = ultima >= min ? "ok" : "bad";
  const rotulo = t => { const s = String(t || ""); return s.length > 9 ? s.slice(0, 8) + "…" : s; };
  // com muitas avaliações, só a primeira e a última ganham nome embaixo
  const comNome = i => pts.length <= 6 || i === 0 || i === pts.length - 1;
  const linha = pts.map((q, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(q.media).toFixed(1)}`).join(" ");
  const desc = `Média de ${m.nome}: ` + pts.map(q => `depois de ${q.p.titulo}, ${fmt(q.media)}`).join("; ") + `. Média mínima ${fmt(min)}.`;
  return `<figure class="evol">
    <figcaption><span><span class="dot" style="background:${esc(m.cor)}"></span> ${esc(m.nome)}</span><span class="chip ${cls} num">${fmt(ultima)}</span></figcaption>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(desc)}">

/* ---------- cronômetro de estudo (Pomodoro) ---------- */
// 25 min de estudo e 5 de pausa. O estado do cronômetro fica só neste aparelho (localStorage),
// guardando a hora em que a fase acaba: assim ele continua certo mesmo se a página recarregar.
// Cada estudo terminado vira um item em "sessoes" (entra no backup e na sincronização).
const FOCO_EST = 25, FOCO_PAUSA = 5, LS_FOCO = "meu-semestre-foco";
let foco = {}; try { foco = JSON.parse(localStorage.getItem(LS_FOCO)) || {}; } catch(e){}
const guardarFoco = () => { try { localStorage.setItem(LS_FOCO, JSON.stringify(foco)); } catch(e){} };
let somCtx = null;
const restaFoco = () => Math.max(0, foco.pausado ?? (foco.fim - Date.now()));
const relogio = ms => { const t = Math.ceil(ms / 1000); return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };
const horasMin = m => m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? " " + (m % 60) + "min" : ""}` : `${m}min`;
function bipe(){
  try {
    if (!somCtx) return;
    [0, 0.35, 0.7].forEach(t => {
      const o = somCtx.createOscillator(), g = somCtx.createGain();
      o.frequency.value = 880; g.gain.setValueAtTime(0.2, somCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, somCtx.currentTime + t + 0.3);
      o.connect(g).connect(somCtx.destination); o.start(somCtx.currentTime + t); o.stop(somCtx.currentTime + t + 0.3);
    });
  } catch(e){}
}
async function avisarFoco(titulo, corpo){
  bipe();
  if (!("Notification" in window) || Notification.permission !== "granted") { toast(titulo); return; }
  const op = { body: corpo, icon: "icon-192.png", tag: "meu-semestre-foco" };
  try { const reg = await navigator.serviceWorker?.getRegistration(); if (reg){ await reg.showNotification(titulo, op); return; } } catch(e){}
  try { new Notification(titulo, op); } catch(e){ toast(titulo); }
}
function minutosSemana(){
  const ini = semanaDe(hojeISO()), tot = {};
  S.sessoes.filter(x => x.data && semanaDe(x.data).getTime() === ini.getTime() && mat(x.materiaId))
    .forEach(x => tot[x.materiaId] = (tot[x.materiaId] || 0) + (num(x.minutos) || 0));
  return Object.entries(tot).sort((a, b) => b[1] - a[1]);
}
function painelFoco(){
  if (!S.materias.length) return "";
  const sem = minutosSemana(), max = Math.max(1, ...sem.map(x => x[1]));
  let topo;
  if (foco.fase){
    const estudo = foco.fase === "estudo";
    topo = `<div class="foco"><div><div class="label">${estudo ? "Estudando" : "Pausa"}</div>
        <div class="t"><span class="dot" style="background:${esc(corDe(foco.materiaId))}"></span> ${esc(nomeDe(foco.materiaId))}</div></div>
      <div class="relogio num" id="focoRelogio">${relogio(restaFoco())}</div>
      <div class="filter">${estudo ? `<button data-acao="focoPausar">${foco.pausado != null ? "Continuar" : "Pausar"}</button><button class="ghost" data-acao="focoParar">Parar</button>`
        : `<button data-acao="focoPular">Pular pausa</button>`}</div></div>`;
  } else {
    const ultima = mat(foco.ultimaMat) ? foco.ultimaMat : S.materias[0].id;
    topo = `<div class="foco"><div class="field" style="margin:0;flex:1;min-width:160px"><label for="focoMat">Matéria</label>
        <select id="focoMat">${S.materias.map(m => `<option value="${m.id}" ${m.id === ultima ? "selected" : ""}>${esc(m.nome)}</option>`).join("")}</select></div>
      <button class="primary" data-acao="focoIniciar">Começar ${FOCO_EST} min</button></div>`;
  }
  return `<section class="panel" style="margin-top:26px">
    <div class="bar" style="margin-bottom:8px"><div><h3 style="margin:0">Cronômetro de estudo</h3>
      <div class="need">${FOCO_EST} min de estudo e ${FOCO_PAUSA} de pausa. Se parar antes, guarda os minutos já estudados.</div></div></div>
    ${topo}
    <h3 style="margin-top:14px;font-size:.95rem">Esta semana${sem.length ? ` · <span class="num">${horasMin(sem.reduce((a, x) => a + x[1], 0))}</span>` : ""}</h3>
    ${sem.length ? `<div class="list">${sem.map(([id, m]) => `<div class="row" style="display:block">
        <div class="bar" style="margin:0"><span><span class="dot" style="background:${esc(corDe(id))}"></span> ${esc(nomeDe(id))}</span><span class="num">${horasMin(m)}</span></div>
        <div class="meter"><i style="width:${m / max * 100}%;background:${esc(corDe(id))}"></i></div></div>`).join("")}</div>`
      : '<p class="empty">Nenhum estudo com o cronômetro nesta semana.</p>'}
  </section>`;
}
async function salvarSessao(materiaId, minutos, dia){
  if (minutos >= 1) await salvar("sessoes", null, { materiaId, data: dia || hojeISO(), minutos });
}
// confere se uma fase acabou (também depois de a página ficar fechada)
async function conferirFoco(){
  if (mode === "carregando" || !foco.fase || foco.pausado != null || Date.now() < foco.fim) return;
  const aoVivo = Date.now() - foco.fim < 5000;
  if (foco.fase === "estudo"){
    const { materiaId, fim } = foco;
    foco = { fase:"pausa", materiaId, ultimaMat: materiaId, fim: fim + FOCO_PAUSA * 60000 }; guardarFoco();
    await salvarSessao(materiaId, FOCO_EST, isoDe(new Date(fim)));
    if (aoVivo) avisarFoco("Hora da pausa", `${FOCO_EST} min de ${nomeDe(materiaId)} concluídos. Descanse ${FOCO_PAUSA} min.`);
    return conferirFoco();
  }
  foco = { ultimaMat: foco.materiaId }; guardarFoco();
  if (aoVivo) avisarFoco("Pausa acabou", "Pronta para mais uma rodada?");
  render();
}
function tiqueFoco(){
  if (!foco.fase) { if (document.title !== "Meu Semestre") document.title = "Meu Semestre"; return; }
  const el = $("#focoRelogio"), txt = relogio(restaFoco());
  if (el) el.textContent = txt;
  document.title = `${txt} · ${foco.fase === "estudo" ? "Estudando" : "Pausa"}`;
  conferirFoco();
}
setInterval(tiqueFoco, 1000);
function acaoFoco(acao){
  if (acao === "focoIniciar"){
    const materiaId = $("#focoMat")?.value; if (!materiaId) return;
    // o som e a permissão de notificação precisam ser liberados num toque
    try { somCtx = somCtx || new (window.AudioContext || window.webkitAudioContext)(); somCtx.resume(); } catch(e){}
    if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {});
    foco = { fase:"estudo", materiaId, ultimaMat: materiaId, inicio: Date.now(), fim: Date.now() + FOCO_EST * 60000 };
  } else if (acao === "focoPausar"){
    if (foco.pausado != null){ foco.fim = Date.now() + foco.pausado; delete foco.pausado; }
    else foco.pausado = foco.fim - Date.now();
  } else if (acao === "focoParar"){
    // guarda os minutos inteiros já estudados
    const feitos = Math.floor((FOCO_EST * 60000 - restaFoco()) / 60000);
    salvarSessao(foco.materiaId, feitos);
    if (feitos >= 1) toast(`${feitos} min guardados`);
    foco = { ultimaMat: foco.materiaId };
  } else if (acao === "focoPular") foco = { ultimaMat: foco.materiaId };
  guardarFoco(); render(); tiqueFoco();
}

function blocoTarefas(m){

    ${ts.length ? `<div class="list">${ts.map(t => linhaTarefa(t, false)).join("")}</div>` : ""}</div>`;
}
async function marcarTarefa(id, feita){
  const t = S.tarefas.find(x => x.id === id); if (!t) return;
  const { id:_, ...resto } = t;
  // ao marcar uma tarefa que se repete, a próxima é criada uma vez só (a marca "proxima" evita repetir)
  const repete = feita && t.repetir && t.data && !t.proxima;
  if (await salvar("tarefas", id, { ...resto, feita, ...(repete ? { proxima:true } : {}) }) && repete){
    const nova = await criarProxima(t);
    if (nova) toast(`Próxima: ${t.titulo}, até ${fmtData(nova)}`);
  }
}
// cria a próxima vez da tarefa; o prazo anda de N em N dias até chegar em hoje ou depois
async function criarProxima(t){
  const passo = +t.repetir; if (!passo || !t.data) return null;
  const d = parseD(t.data), hoje = parseD(hojeISO());
  do d.setDate(d.getDate() + passo); while (d < hoje);
  const data = isoDe(d);
  await salvar("tarefas", null, { materiaId:t.materiaId, titulo:t.titulo, data, repetir:t.repetir, feita:false });
  return data;
}

// aceita só endereços http/https; sem "https://" na frente, ele é colocado
function linkSeguro(u){
  let t = String(u || "").trim(); if (!t) return null;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(t)) t = "https://" + t;
  try { const x = new URL(t); return /^https?:$/.test(x.protocol) ? x.href : null; } catch(e){ return null; }
}
const nomeLink = l => l.titulo || l.url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
function blocoNotas(m){
  const links = (m.links || []).filter(l => linkSeguro(l.url));
  return `<div class="notas">
    ${links.length ? `<div class="links">${links.map(l => `<a href="${esc(linkSeguro(l.url))}" target="_blank" rel="noopener noreferrer">${esc(nomeLink(l))}</a>`).join("")}</div>` : ""}
    ${m.anotacoes ? `<div class="nota-txt">${esc(m.anotacoes)}</div>` : ""}
    <button class="ghost" data-acao="notas" data-id="${m.id}">${links.length || m.anotacoes ? "Editar anotações e links" : "+ Anotações e links"}</button></div>`;
}

/* ---------- datas digitadas ---------- */
// As datas são digitadas (dd/mm/aaaa) em vez de escolhidas num calendário. Por dentro continuam
// guardadas como aaaa-mm-dd. Dá para digitar só dd/mm (vale o ano atual) ou o ano com 2 dígitos.
const isoParaBr = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso || "") ? iso.slice(8,10) + "/" + iso.slice(5,7) + "/" + iso.slice(0,4) : "";
// devolve "" quando está vazio, null quando a data não existe
function brParaIso(txt){
  const t = String(txt || "").trim(); if (!t) return "";
  const m = t.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2}|\d{4}))?$/); if (!m) return null;
  const d = +m[1], mes = +m[2], ano = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : new Date().getFullYear();
  const dt = new Date(ano, mes - 1, d);
  return dt.getFullYear() === ano && dt.getMonth() === mes - 1 && dt.getDate() === d ? isoDe(dt) : null;
}
function campoData(id, nome, rotulo, val){
  const iso = brParaIso(isoParaBr(val)) ? val : "";
  return `<div class="field"><label for="${id}">${rotulo}</label><input id="${id}" ${nome ? `name="${nome}"` : ""} type="text" inputmode="numeric" autocomplete="off"
    maxlength="10" placeholder="dd/mm/aaaa" data-data value="${esc(isoParaBr(iso))}"><span class="need dia-sem">${iso ? fmtData(iso) : ""}</span></div>`;
}
// coloca as barras sozinho enquanto digita e mostra o dia da semana embaixo
document.addEventListener("input", e => {
  const el = e.target; if (!el.matches?.("[data-data]")) return;
  let n = el.value.replace(/[^\d/]/g, "");
  const partes = n.split("/"), manual = partes.length > 1 && partes.slice(0, -1).some(p => p.length !== 2);
  // só põe as barras sozinho quando a pessoa digita só números (ou já no formato dd/mm); apagando, não mexe
  if (!e.inputType?.startsWith("delete") && !manual){
    const d = n.replace(/\//g, "").slice(0, 8);
    n = d.length > 4 ? d.slice(0,2) + "/" + d.slice(2,4) + "/" + d.slice(4) : d.length > 2 ? d.slice(0,2) + "/" + d.slice(2) : d;
  }
  if (el.value !== n) el.value = n;
  const iso = brParaIso(n), dica = el.parentElement.querySelector(".dia-sem");
  if (dica) dica.textContent = iso ? fmtData(iso) : n.length >= 5 ? "Data inválida" : "";
});

function campoHTML(c, v){
  const id = "f_"+c.k;
  let val = v ?? (typeof c.def==="function"?c.def():c.def) ?? "";
  // números aparecem com vírgula, como se escreve em português (7,5 e não 7.5)
  if (c.t==="num" && typeof val==="number") val = String(val).replace(".", ",");
  if (c.t==="select"){ const o = typeof c.opts==="function"?c.opts():c.opts;
    return `<div class="field"><label for="${id}">${c.l}</label><select id="${id}" name="${c.k}">${o.map(([a,b])=>`<option value="${esc(a)}" ${String(val)===String(a)?"selected":""}>${esc(b)}</option>`).join("")}</select>${c.hint?`<span class="need">${c.hint}</span>`:""}</div>`; }
  if (c.t==="check") return `<div class="field check"><input type="checkbox" id="${id}" name="${c.k}" ${val?"checked":""}><label for="${id}">${c.l}</label></div>`;
  if (c.t==="area") return `<div class="field"><label for="${id}">${c.l}</label><textarea id="${id}" name="${c.k}">${esc(val)}</textarea></div>`;
  if (c.t==="cor"){ const cur = val || CORES[S.materias.length % CORES.length];
    return `<div class="field"><span class="label" style="text-transform:none;letter-spacing:0;font-size:.82rem">${c.l}</span><div class="swatches">${CORES.map((h,i)=>`<input type="radio" name="cor" id="cor${i}" value="${h}" ${h===cur?"checked":""}><label for="cor${i}" style="background:${h}" title="${h}"></label>`).join("")}</div></div>`; }
  if (c.t==="date") return campoData(id, c.k, c.l, val);
  const type = c.t==="num"?"text":c.t;
  return `<div class="field"><label for="${id}">${c.l}</label><input id="${id}" name="${c.k}" type="${type}" ${c.t==="num"?'inputmode="decimal"':""} value="${esc(val)}" ${c.req?"required":""} placeholder="${esc(c.ph||"")}">${c.hint?`<span class="need">${c.hint}</span>`:""}</div>`;
}

// devolve [campo, mensagem] no primeiro problema, ou null se está tudo certo
function validar(col, out, raw){
  for (const c of FORMS[col].campos.flatMap(c => c.duo || [c]))
    if (c.t==="num" && String(raw[c.k] ?? "").trim() !== "" && out[c.k] == null) return [c.k, `${c.l.split(" (")[0]}: use só números.`];
    else if (c.t==="date" && out[c.k] == null) return [c.k, "Data inválida. Use dd/mm/aaaa, por exemplo 05/03/2026."];
  if (col==="materias" && out.cargaHoraria != null && out.cargaHoraria <= 0) return ["cargaHoraria", "O total de aulas precisa ser maior que zero."];
  if (col==="cronograma"){
    if (!out.inicio || !out.fim) return [out.inicio ? "fim" : "inicio", "Informe o horário de início e de fim."];
    if (out.fim <= out.inicio) return ["fim", "O fim precisa ser depois do início."];
  }
  if (col==="faltas"){
    if (!out.data) return ["data", "Informe a data da falta."];
    if (out.aulas == null || out.aulas < 1) return ["aulas", "Informe quantas aulas você perdeu (1 ou mais)."];
  }
  if (col==="eventos"){
    if (!out.data) return ["data", "Informe o dia do evento."];
    if (out.dataFim && out.dataFim < out.data) return ["dataFim", "O último dia precisa ser igual ou depois do primeiro."];
  }
  if (col==="anotacoes" && !String(out.texto || "").trim()) return ["texto", "Escreva a anotação."];
  if (col==="tarefas" && out.repetir && !out.data) return ["data", "Para repetir, informe o prazo da primeira vez."];
  if (col==="provas"){
    if (out.notaMax == null || out.notaMax <= 0) return ["notaMax", "Informe quanto a avaliação vale (maior que zero)."];
    if (out.peso == null || out.peso <= 0) return ["peso", "O peso precisa ser maior que zero."];
    if (out.nota != null && (out.nota < 0 || out.nota > out.notaMax)) return ["nota", `A nota precisa ficar entre 0 e ${fmt(out.notaMax)}.`];
  }
  return null;
}
function mostrarErro(campoId, msg){
  const e = $("#erro"); e.textContent = msg; e.hidden = false;
  document.getElementById(campoId)?.focus();
}

function abrirForm(col, id, preset={}){
  const F = FORMS[col], item = id ? S[col].find(x=>x.id===id) : null;
  if (col!=="materias" && col!=="eventos" && col!=="anotacoes" && !S.materias.length){ toast("Cadastre uma matéria primeiro."); location.hash="#materias"; return; }
  const dados = { ...preset, ...(item||{}) };
  const campos = F.campos.map(c => c.duo ? `<div class="duo">${c.duo.map(d=>campoHTML(d,dados[d.k])).join("")}</div>` : campoHTML(c, dados[c.k])).join("");
  const frm = $("#frm");
  frm.innerHTML = `<h2>${id?"Editar":F.masc?"Novo":"Nova"} ${F.titulo.toLowerCase()}</h2>${campos}
    <p class="erro" id="erro" role="alert" hidden></p>
    <div class="actions">${id?`<button type="button" class="danger" id="del">Excluir</button>`:"<span></span>"}
      <div class="r"><button type="button" id="cancel">Cancelar</button><button type="submit" class="primary">Salvar</button></div></div>`;
  frm.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(frm), out = {}, raw = {};
    const todos = F.campos.flatMap(c => c.duo || [c]);
    todos.forEach(c => { if (c.t==="check") out[c.k] = fd.has(c.k); else { let v = fd.get(c.k) ?? ""; raw[c.k] = v; if (c.t==="num") v = num(v); if (c.t==="date") v = brParaIso(v); out[c.k] = v; } });
    const erro = validar(col, out, raw);
    if (erro){ mostrarErro("f_"+erro[0], erro[1]); return; }
    if (col==="cronograma") out.dia = +out.dia;
    // mantém os campos que o formulário não mostra (anotações, links, marca de exemplo)
    const { id:_, ...resto } = item || {};
    if (col==="anotacoes" && !resto.criada) out.criada = new Date().toISOString();
    // tarefa que se repete marcada como feita no formulário: cria a próxima
    const repete = col==="tarefas" && out.feita && out.repetir && !resto.proxima;
    const ok = await salvar(col, id, { ...resto, ...out, ...(repete ? { proxima:true } : {}) });
    if (ok && repete) await criarProxima({ ...resto, ...out });
    if (ok){ $("#dlg").close(); toast("Salvo"); }
  };
  $("#cancel").onclick = () => $("#dlg").close();
  const del = $("#del");
  // apagar uma matéria leva junto os blocos, faltas e provas dela
  const deps = col==="materias" ? ["cronograma","faltas","provas","tarefas","sessoes"].flatMap(c => S[c].filter(x => x.materiaId === id).map(x => [c, x.id])) : [];
  if (del) del.onclick = async () => {
    if (del.dataset.arm){
      del.disabled = true;
      for (const [c, i] of deps) await apagar(c, i);
      await apagar(col, id); $("#dlg").close(); toast("Excluído"); return;
    }
    del.dataset.arm = 1;
    del.textContent = deps.length ? `Confirmar: apaga também ${deps.length} ${deps.length>1?"itens":"item"} dela` : "Confirmar exclusão";
    setTimeout(() => { if (del.isConnected){ delete del.dataset.arm; del.textContent = "Excluir"; } }, 3500);
  };
  $("#dlg").showModal();
}

// "Faltei hoje": registra a falta de hoje em várias matérias de uma vez.
// Já vêm marcadas as matérias com aula hoje no cronograma; o número de aulas sai da duração do bloco (50 min por aula).
function abrirFaltei(){
  if (!S.materias.length){ toast("Cadastre uma matéria primeiro."); location.hash="#materias"; return; }
  const hoje = hojeISO(), dia = new Date().getDay(), aulasHoje = {};
  const folga = semAula(hoje);
  S.cronograma.filter(b => !folga && +b.dia === dia && b.tipo === "aula" && b.inicio && b.fim).forEach(b => {
    const [h1,m1] = b.inicio.split(":").map(Number), [h2,m2] = b.fim.split(":").map(Number);
    aulasHoje[b.materiaId] = (aulasHoje[b.materiaId] || 0) + Math.max(1, Math.round(((h2*60+m2) - (h1*60+m1)) / 50));
  });
  const jaTem = id => S.faltas.some(f => f.materiaId === id && f.data === hoje);
  const lista = [...S.materias].sort((a,b) => (aulasHoje[b.id] ? 1 : 0) - (aulasHoje[a.id] ? 1 : 0));

  frm.onsubmit = async e => { e.preventDefault();

// Simulador de nota: testa notas imaginárias sem salvar nada.
function abrirSimulador(materiaId){
  if (!S.materias.length){ toast("Cadastre uma matéria primeiro."); location.hash="#materias"; return; }
  let mid = mat(materiaId) ? materiaId : mat(filtroProvas) ? filtroProvas : (S.materias.find(m => S.provas.some(p => p.materiaId === m.id)) || S.materias[0]).id;
  const frm = $("#frm");
  const desenhar = () => {
    const its = S.provas.filter(p => p.materiaId === mid).sort((a,b) => (a.data||"9").localeCompare(b.data||"9"));
    frm.innerHTML = `<h2>Simular nota</h2>
      <p class="need">Digite notas de mentira para ver como fica sua média. Nada aqui é salvo.</p>
      <div class="field"><label for="simMat">Matéria</label><select id="simMat">${S.materias.map(m => `<option value="${m.id}" ${m.id===mid?"selected":""}>${esc(m.nome)}</option>`).join("")}</select></div>
      ${its.length ? `<div class="faltei">${its.map(p => { const n = num(p.nota), mx = num(p.notaMax) || 10; return `<div class="row">
        <div class="grow"><div class="t">${esc(p.titulo)}</div><div class="m">${rotProva(p.tipo)} · peso ${fmt(num(p.peso)??1)} · ${n!=null?"nota real "+fmt(n):"sem nota"}</div></div>
        <input class="qtd" data-sim="${p.id}" inputmode="decimal" value="${n!=null?esc(fmt(n)):""}" placeholder="?" aria-label="Nota em ${esc(p.titulo)} (de 0 a ${fmt(mx)})">
        <span class="need">/${fmt(mx)}</span></div>`; }).join("")}</div>
        <div class="panel" id="simRes" aria-live="polite"></div>`
      : '<p class="empty">Esta matéria ainda não tem provas ou trabalhos. Cadastre na aba Provas para simular.</p>'}
      <div class="actions">${its.length?'<button type="button" class="ghost" id="simLimpa">Voltar às notas reais</button>':"<span></span>"}<div class="r"><button type="button" id="cancel">Fechar</button></div></div>`;
    $("#cancel").onclick = () => $("#dlg").close();
    $("#simMat").onchange = e => { mid = e.target.value; desenhar(); };
    if (!its.length) return;
    const calcular = () => {
      let erro = "";
      const sim = its.map(p => { const el = frm.querySelector(`[data-sim="${p.id}"]`), mx = num(p.notaMax) || 10, raw = el.value.trim(), n = num(raw);
        const ruim = raw !== "" && (n == null || n < 0 || n > mx);
        el.setAttribute("aria-invalid", ruim); if (ruim && !erro) erro = `${p.titulo}: use um número de 0 a ${fmt(mx)}.`;
        return { ...p, nota: ruim ? null : n }; });
      const r = calcNotas(sim), min = S.config.mediaMin;
      const frase = r.media == null ? "Preencha pelo menos uma nota."
        : r.resta === 0 ? (r.media >= min ? `Passa por nota: média final ${fmt(r.media)}.` : `Abaixo da média mínima de ${fmt(min)}: faltariam ${fmt(min - r.media)} pontos.`)
        : r.precisa <= 0 ? "A média mínima já está garantida, mesmo tirando 0 no que falta."
        : r.precisa > 10 ? "Com essas notas, não dá para chegar na média mínima."
        : `Para fechar com ${fmt(min)}, você precisa de <b class="num">${fmt(r.precisa)}</b> (de 10) em média no que ficou em branco.`;
      $("#simRes").innerHTML = `<div class="bar" style="margin:0"><div><div class="label">Média ${r.resta ? "até agora" : "final"}</div>${chipMedia(r.media)}</div><div class="need" style="flex:1 1 200px">${frase}</div></div>
        ${erro ? `<p class="erro" role="alert" style="margin-top:8px">${esc(erro)}</p>` : ""}`;
    };
    frm.oninput = e => { if (e.target.dataset.sim) calcular(); };
    $("#simLimpa").onclick = desenhar;
    calcular();
  };
  frm.onsubmit = e => e.preventDefault();
  frm.oninput = null;
  desenhar();
  $("#dlg").showModal();
}

// Baixa o backup. Devolve true quando o arquivo foi entregue.
async function baixarBackup(){
  const data = JSON.stringify({ app:"meu-semestre", versao:1, ...Object.fromEntries(COLS.map(c=>[c,S[c]])), config:S.config }, null, 2);
  const nome = "meu-semestre-"+hojeISO()+".json";
  if (!window.claude){
    // fora do Claude (site próprio ou arquivo aberto no navegador): download direto
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type:"application/json" }));
    a.download = nome; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    marcarBackup(); render(); toast("Backup baixado"); return true;
  }
  const dl = await window.claude?.use?.("downloads").catch(()=>null);
  if (!dl){ try { await navigator.clipboard.writeText(data); toast("Backup copiado. Cole num arquivo .json"); return true; } catch(e){ toast("Não foi possível baixar aqui."); return false; } }
  try { await dl.save({ filename:nome, data }); toast("Backup salvo"); return true; }
  catch(e){ if (e.code!=="declined") toast("Não foi possível salvar o arquivo."); return false; }
}
// Novo semestre: guarda um backup, mantém as matérias marcadas (as anuais) com tudo que é delas
// e apaga as outras, junto com os eventos que já passaram.
/* ---------- histórico de semestres ---------- */
// ex.: em novembro de 2026 sugere "2026.2"
const nomeSemestreSugerido = () => { const d = new Date(); return d.getFullYear() + "." + (d.getMonth() < 6 ? 1 : 2); };
const arred = v => v == null ? null : Math.round(v * 100) / 100;
function registroSemestre(nome, ids){
  return { id: uid(), nome, data: hojeISO(), mediaMin: S.config.mediaMin, freqMin: S.config.freqMin,
    materias: ids.map(id => { const m = mat(id), n = resumoNotas(id), f = resumoFaltas(id);
      return { nome: m?.nome || "Sem nome", cor: m?.cor || "#6b7a8f", professor: m?.professor || "", media: arred(n.media), faltas: f.total, limite: f.limite }; }) };
}
function situacao(m, sem){
  if (m.limite != null && m.faltas > m.limite) return '<span class="chip bad">reprovada por falta</span>';
  if (m.media == null) return '<span class="chip">sem notas</span>';
  return m.media >= sem.mediaMin ? '<span class="chip ok">aprovada</span>' : '<span class="chip bad">abaixo da média</span>';
}
function blocoHistorico(){
  const hs = [...(S.config.historico || [])].reverse();

      const geral = comNota.length ? comNota.reduce((a,m) => a + m.media, 0) / comNota.length : null;
      return `<details class="sem"><summary><b>${esc(sem.nome)}</b> <span class="need">· ${sem.materias.length} ${sem.materias.length===1?"matéria":"matérias"}${geral!=null?` · média geral <b class="num">${fmt(geral)}</b>`:""}</span></summary>
        <div class="tbl-wrap"><table><thead><tr><th>Matéria</th><th>Média final</th><th>Faltas</th><th>Situação</th></tr></thead><tbody>
        ${sem.materias.map(m => `<tr><td><span class="dot" style="background:${esc(m.cor)}"></span> ${esc(m.nome)}${m.professor?`<div class="need">${esc(m.professor)}</div>`:""}</td>
          <td class="num">${fmt(m.media)}</td><td class="num">${m.faltas}${m.limite!=null?" / "+m.limite:""}</td><td>${situacao(m, sem)}</td></tr>`).join("")}
        </tbody></table></div>
        <p class="need">Fechado em ${fmtData(sem.data)} · média mínima ${fmt(sem.mediaMin)} · frequência mínima ${sem.freqMin}%
          <button class="ghost danger" data-hist="${sem.id}">Apagar registro</button></p></details>`; }).join("")}

async function apagarHistorico(b){

/* ---------- agenda (.ics) ---------- */
// Gera um arquivo de calendário com as provas e entregas futuras. O UID é fixo por item,
// então importar de novo atualiza os eventos em vez de duplicar.
function gerarICS(){
  const txt = v => String(v ?? "").replace(/\\/g,"\\\\").replace(/[,;]/g,"\\$&").replace(/\r?\n/g,"\\n");
  const dia = iso => iso.replace(/-/g,"");
  const seguinte = iso => { const d = parseD(iso); d.setDate(d.getDate()+1); return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"); };
  const agora = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  // linhas longas são quebradas, como o formato pede
  const dobrar = l => { const ch = [...l], partes = []; while (ch.length > 60) partes.push(ch.splice(0, 60).join("")); partes.push(ch.join("")); return partes.join("\r\n "); };
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Meu Semestre//PT-BR","CALSCALE:GREGORIAN","X-WR-CALNAME:Meu Semestre"];
  const itens = [
    ...S.provas.filter(p => p.data && diasAte(p.data) >= 0).map(p => ({ id:p.id, data:p.data, fim:p.data, titulo:p.titulo, resumo:`${p.titulo} · ${nomeDe(p.materiaId)}`, conteudo:p.conteudo })),
    ...S.eventos.filter(e => e.data && diasAte(e.dataFim || e.data) >= 0).map(e => ({ id:e.id, data:e.data, fim:e.dataFim || e.data, titulo:e.titulo, resumo:e.titulo, conteudo:e.obs })),
    ...S.tarefas.filter(t => !t.feita && t.data && diasAte(t.data) >= 0).map(t => ({ id:t.id, data:t.data, fim:t.data, titulo:t.titulo, resumo:`Tarefa: ${t.titulo} · ${nomeDe(t.materiaId)}`, tarefa:true })),
  ].sort((a,b) => a.data.localeCompare(b.data));
  itens.forEach(p => {
    L.push("BEGIN:VEVENT", "UID:"+p.id+"@meu-semestre", "DTSTAMP:"+agora,
      "DTSTART;VALUE=DATE:"+dia(p.data), "DTEND;VALUE=DATE:"+seguinte(p.fim),
      "SUMMARY:"+txt(p.resumo));
    if (p.conteudo) L.push("DESCRIPTION:"+txt(p.conteudo));
    // avisos às 9h: uma semana antes (só provas e eventos) e na véspera
    if (!p.tarefa) L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+txt(p.titulo+" em uma semana"),"TRIGGER:-P6DT15H","END:VALARM");
    L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+txt(p.titulo+" amanhã"),"TRIGGER:-PT15H","END:VALARM","END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return { n: itens.length, ics: L.map(dobrar).join("\r\n") + "\r\n" };
}
/* ---------- lembretes ---------- */
// Com o site fechado, quem avisa é a agenda do celular (arquivo .ics com alarmes).
// Com o site aberto, dá para mostrar uma notificação do sistema uma vez por dia.
const LS_AVISOS = "meu-semestre-avisos";
let avisos = {}; try { avisos = JSON.parse(localStorage.getItem(LS_AVISOS)) || {}; } catch(e){}
const guardarAvisos = () => { try { localStorage.setItem(LS_AVISOS, JSON.stringify(avisos)); } catch(e){} };
const podeNotificar = () => "Notification" in window && Notification.permission === "granted";
// o que vence hoje ou amanhã e ainda está pendente
function vencendo(){
  const perto = d => d === 0 || d === 1, quando = d => d === 0 ? "hoje" : "amanhã";
  return [
    ...S.provas.filter(p => p.data && num(p.nota) == null && perto(diasAte(p.data))).map(p => `${p.titulo} (${nomeDe(p.materiaId)}) ${quando(diasAte(p.data))}`),
    ...S.eventos.filter(e => e.data && perto(diasAte(e.data))).map(e => `${e.titulo} ${quando(diasAte(e.data))}`),
    ...S.tarefas.filter(t => !t.feita && t.data && (perto(diasAte(t.data)) || diasAte(t.data) < 0)).map(t => `Tarefa: ${t.titulo} ${diasAte(t.data) < 0 ? "atrasada" : quando(diasAte(t.data))}`),
  ];
}
async function notificar(titulo, corpo){
  const op = { body: corpo, icon: "icon-192.png", badge: "icon-192.png", tag: "meu-semestre" };
  try { const reg = await navigator.serviceWorker?.getRegistration(); if (reg){ await reg.showNotification(titulo, op); return; } } catch(e){}
  try { new Notification(titulo, op); } catch(e){}
}
function avisoDoDia(){
  if (!FORA_DO_CLAUDE || !avisos.ligado || !podeNotificar() || avisos.ultimo === hojeISO()) return;
  const l = vencendo(); avisos.ultimo = hojeISO(); guardarAvisos();
  if (l.length) notificar(l.length === 1 ? "Meu Semestre: 1 lembrete" : `Meu Semestre: ${l.length} lembretes`, l.slice(0, 5).join("\n") + (l.length > 5 ? `\ne mais ${l.length - 5}` : ""));
}

  frm.innerHTML = `<h2>Lembretes</h2>
    <h3>Com o site fechado: agenda do celular</h3>
